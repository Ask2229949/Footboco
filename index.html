<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Footboco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Anton&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg-a:#060B14;
    --bg-b:#0A1622;
    --panel:#0E1B2A;
    --panel-hi:#132840;
    --panel-glass:rgba(19,40,64,0.62);
    --line:rgba(216,230,244,0.10);
    --line-hi:rgba(216,230,244,0.18);
    --gold:#F0B93E;
    --gold-hi:#FFE39A;
    --gold-dim:#8a6a1f;
    --emerald:#22D18C;
    --emerald-dim:#12693F;
    --white:#F1F6FB;
    --muted:#8DA0B8;
    --muted-dim:#5C6E82;
    --crimson:#FF5D6C;
    --azure:#4FA0FF;
    --violet:#9B6BFF;
    --icon1:#8A5CFF;
    --icon2:#2FD8D0;
    --r-lg:22px;
    --r-md:16px;
    --r-sm:12px;
    --shadow-lift:0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 620px at 15% -8%, rgba(240,185,62,0.10), transparent 58%),
      radial-gradient(900px 620px at 100% 8%, rgba(139,92,255,0.12), transparent 55%),
      radial-gradient(1000px 700px at 50% 120%, rgba(34,209,140,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-a), var(--bg-b) 60%, #060B14);
    color:var(--white);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background 0.5s ease;
  }

  /* ===== خلفية استاد حقيقي لغرفة الانتظار (لوبي) — أنوار كشافات + ملعب عشب،
     كله CSS/SVG بدون أي صور فعلية، عشان يدي إحساس احترافي متل نقل مباراة ===== */
  body.stage-lobby{
    background:
      radial-gradient(620px 420px at 10% 0%, rgba(255,255,255,0.16), transparent 55%),
      radial-gradient(620px 420px at 90% 0%, rgba(255,255,255,0.14), transparent 55%),
      radial-gradient(900px 500px at 50% 8%, rgba(240,185,62,0.10), transparent 60%),
      linear-gradient(180deg, #050c14 0%, #071019 38%, #0a2417 68%, #0e3220 84%, #0a2417 100%);
  }
  .stadium-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .6s ease;}
  body.stage-lobby .stadium-fx{opacity:1;}
  .stadium-fx .beam{position:absolute;top:-12%;width:38vw;max-width:460px;height:130vh;
    background:linear-gradient(180deg, rgba(255,252,235,0.16), rgba(255,252,235,0.02) 55%, transparent 78%);
    filter:blur(2px);}
  .stadium-fx .beam.l{left:-8%;transform:rotate(18deg);transform-origin:top left;}
  .stadium-fx .beam.r{right:-8%;transform:rotate(-18deg);transform-origin:top right;}
  .stadium-fx .crowd{position:absolute;left:0;right:0;top:0;height:120px;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.1px, transparent 1.2px);
    background-size:7px 7px;mask-image:linear-gradient(180deg, rgba(0,0,0,0.55), transparent);}
  .stadium-fx .pitch{position:absolute;left:0;right:0;bottom:0;height:46vh;min-height:260px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 3%, rgba(0,0,0,0.05) 3% 6%),
      linear-gradient(180deg, rgba(10,40,25,0) 0%, rgba(8,28,16,0.55) 40%, rgba(6,20,12,0.85) 100%);
    transform:perspective(420px) rotateX(58deg);transform-origin:bottom;}
  .stadium-fx .pitch::before{content:'';position:absolute;left:8%;right:8%;top:14%;height:1px;background:rgba(255,255,255,0.20);}
  .stadium-fx .pitch::after{content:'';position:absolute;left:50%;top:14%;width:120px;height:120px;margin:-60px 0 0 -60px;
    border:1.5px solid rgba(255,255,255,0.20);border-radius:50%;}
  .stadium-fx .vignette{position:absolute;inset:0;box-shadow:inset 0 0 180px 60px rgba(0,0,0,0.55);}
  .display{font-family:'Anton','Tajawal',sans-serif; letter-spacing:0.5px;}
  .num{font-family:'Manrope','Tajawal',sans-serif;}
  .wrap{max-width:940px;margin:0 auto;padding:18px 14px 70px;position:relative;}

  .brand{display:flex;align-items:center;justify-content:center;gap:11px;padding:20px 0 18px;}
  .brand .mark{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;
    background:linear-gradient(160deg, var(--gold-hi), var(--gold) 60%, #a9791b);box-shadow:0 8px 20px rgba(240,185,62,0.28), inset 0 1px 0 rgba(255,255,255,0.4);}
  .brand .titles{text-align:center;}
  .brand h1{font-size:19px;font-weight:900;letter-spacing:0.3px;margin:0;line-height:1.15;
    background:linear-gradient(180deg,var(--white),#b9cbdd);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand .tag{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:0.4px;margin-top:1px;}

  .card{background:linear-gradient(175deg, var(--panel-hi), var(--panel));border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;
    box-shadow:var(--shadow-lift);
    animation:cardIn .34s cubic-bezier(.2,.8,.2,1);}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(0.985);}to{opacity:1;transform:translateY(0) scale(1);}}
  @media (prefers-reduced-motion: reduce){ .card{animation:none;} }

  h2{font-size:19px;font-weight:900;margin:0 0 5px;}
  p.sub{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.65;}

  .tabs{display:flex;gap:8px;margin-bottom:20px;background:rgba(0,0,0,0.22);border-radius:14px;padding:5px;}
  .tab{flex:1;text-align:center;padding:11px;border-radius:10px;cursor:pointer;font-weight:800;font-size:13.5px;color:var(--muted);transition:all .18s ease;}
  .tab.active{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#241c00;box-shadow:0 6px 16px rgba(240,185,62,0.25);}

  label{font-size:12px;color:var(--muted);font-weight:800;display:block;margin-bottom:7px;letter-spacing:0.2px;}
  input[type=text]{
    width:100%;padding:14px 15px;border-radius:var(--r-sm);border:1.5px solid var(--line);
    background:rgba(0,0,0,0.25);color:var(--white);font-family:inherit;font-size:16px;font-weight:700;
    outline:none;letter-spacing:0.5px;transition:border-color .15s ease, background .15s ease;
  }
  input[type=text]:focus{border-color:var(--gold);background:rgba(0,0,0,0.34);}
  input[type=text]::placeholder{color:#4a5c70;font-weight:500;}

  .field{margin-bottom:15px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 18px;border-radius:var(--r-sm);border:none;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:14.5px;transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
    width:100%;
  }
  .btn:active{transform:scale(0.97);}
  .btn-gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#241c00;box-shadow:0 8px 20px rgba(240,185,62,0.24), inset 0 1px 0 rgba(255,255,255,0.5);}
  .btn-gold:not(:disabled):hover{filter:brightness(1.04);box-shadow:0 10px 26px rgba(240,185,62,0.34);}
  .btn-gold:disabled{filter:grayscale(0.6);opacity:0.38;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{background:rgba(255,255,255,0.055);color:var(--white);border:1.5px solid var(--line-hi);}
  .btn-ghost:hover{background:rgba(255,255,255,0.09);}
  .btn:disabled{opacity:0.55;cursor:not-allowed;transform:none;}
  .bid-actions.is-bidding{position:relative;}
  .bid-actions.is-bidding .btn{transform:scale(0.97);filter:brightness(0.92);}
  .btn-emerald{background:linear-gradient(180deg,#4de3a7,var(--emerald));color:#04241a;box-shadow:0 8px 20px rgba(34,209,140,0.22);}
  .err{color:#ff9099;font-size:13px;margin-top:8px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .err::before{content:'⚠';}

  .room-code-big{
    text-align:center;font-size:40px;font-weight:900;letter-spacing:12px;color:var(--gold);
    font-family:'Manrope',sans-serif;
    background:radial-gradient(circle at 50% 0%, rgba(240,185,62,0.10), rgba(0,0,0,0.32));
    border:1.5px dashed var(--gold-dim);border-radius:16px;padding:18px 0 18px 24px;margin-bottom:16px;
  }
  .share-link{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,0.24);border-radius:var(--r-sm);padding:9px 11px;margin-bottom:18px;border:1px solid var(--line);}
  .share-link input{border:none;background:transparent;color:var(--muted);font-size:12px;padding:4px;font-family:'Manrope',sans-serif;}
  .copy-btn{background:linear-gradient(180deg,#a78bff,var(--icon1));color:white;border:none;border-radius:9px;padding:9px 14px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap;transition:transform .12s;}
  .copy-btn:active{transform:scale(0.95);}

  .players-list{display:flex;flex-direction:column;gap:9px;margin-bottom:20px;}
  .prow{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,0.035);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;}
  .avatar{width:38px;height:38px;border-radius:11px;background:linear-gradient(160deg,var(--panel-hi),#0a1727);border:1px solid var(--line-hi);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0;color:var(--gold-hi);}
  .prow .name{font-weight:800;flex:1;font-size:14px;}
  .host-badge{font-size:9.5px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#241c00;padding:3px 8px;border-radius:20px;font-weight:900;letter-spacing:0.2px;}
  .waiting-dot{width:8px;height:8px;border-radius:50%;background:var(--emerald);box-shadow:0 0 10px var(--emerald);}

  /* ticker */
  .ticker{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 16px;margin-bottom:2px;}
  .ticker::-webkit-scrollbar{height:4px;}
  .tchip{flex-shrink:0;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,0.035);border:1px solid var(--line);border-radius:14px;padding:9px 13px;min-width:138px;transition:all .18s ease;}
  .tchip.leading{border-color:var(--gold);background:rgba(240,185,62,0.10);box-shadow:0 0 0 1px rgba(240,185,62,0.3), 0 6px 16px rgba(240,185,62,0.12);}
  .tchip.left{opacity:0.5;filter:grayscale(0.7);}
  .tchip.left .tc{color:var(--crimson);font-weight:800;}
  .tchip .tav{width:28px;height:28px;border-radius:9px;background:linear-gradient(160deg,var(--panel-hi),#0a1727);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:900;flex-shrink:0;color:var(--gold-hi);}
  .tchip .tinfo{display:flex;flex-direction:column;}
  .tchip .tn{font-size:11.5px;font-weight:800;color:var(--white);}
  .tchip .tb{font-size:13.5px;font-weight:900;color:var(--gold);font-family:'Manrope',sans-serif;}
  .tchip .tc{font-size:9.5px;color:var(--muted);}

  /* AUCTION CARD */
  .jumbo{position:relative;border-radius:26px;padding:2px;overflow:hidden;margin-top:8px;}
  .jumbo-inner{position:relative;border-radius:24px;padding:24px 18px 22px;text-align:center;overflow:hidden;background:linear-gradient(175deg, var(--panel-hi), var(--panel));}
  .jumbo-bronze{background:linear-gradient(135deg,#B27A46,#6b4420,#B27A46);}
  .jumbo-silver{background:linear-gradient(135deg,#E4E9EE,#7c8794,#E4E9EE);}
  .jumbo-gold{background:linear-gradient(135deg,var(--gold-hi),#8a6a12,var(--gold-hi));}
  .jumbo-icon{background:linear-gradient(135deg,var(--icon1),var(--icon2),var(--icon1));}
  .jumbo-icon .jumbo-inner{background:linear-gradient(180deg, rgba(138,92,255,0.16), var(--panel));}

  .tier-tag{position:absolute;top:14px;right:14px;z-index:3;font-size:10px;font-weight:900;padding:5px 12px;border-radius:20px;letter-spacing:0.4px;}
  .tier-tag.bronze{background:linear-gradient(90deg,#d4986a,#B27A46);color:#2b1b0c;}
  .tier-tag.silver{background:linear-gradient(90deg,#f2f5f8,#c3cad2);color:#20242a;}
  .tier-tag.gold{background:linear-gradient(90deg,var(--gold-hi),var(--gold));color:#241c00;}
  .tier-tag.icon{background:linear-gradient(90deg,var(--icon2),var(--icon1));color:white;}

  .shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.14) 50%, transparent 58%);background-size:220% 220%;animation:shineMove 3.4s ease-in-out infinite;}
  @keyframes shineMove{0%{background-position:120% 0;}100%{background-position:-20% 0;}}
  @media (prefers-reduced-motion: reduce){ .shine{animation:none;} }

  .jumbo{transition:transform 0.15s ease-out;transform-style:preserve-3d;}
  .jumbo-inner{position:relative;}

  .ovr-badge{position:absolute;top:14px;left:14px;z-index:4;text-align:center;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.45));}
  .ovr-badge .n{font-family:'Anton';font-size:27px;color:var(--gold-hi);letter-spacing:0.5px;}
  .ovr-badge .p{font-size:9px;font-weight:900;color:var(--muted);letter-spacing:1px;margin-top:1px;}

  .photo-ring-wrap{width:132px;height:132px;margin:6px auto 10px;position:relative;}
  .photo-ring-wrap svg{position:absolute;inset:0;transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:rgba(255,255,255,0.10);stroke-width:6;}
  .ring-fg{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 0.4s linear, stroke 0.3s;}
  .photo-frame{position:absolute;inset:13px;border-radius:50%;overflow:hidden;background:#0a1520;border:2px solid rgba(255,255,255,0.16);box-shadow:0 6px 20px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.06);}
  .photo-frame img{width:100%;height:100%;object-fit:cover;object-position:top center;}
  .secs-badge{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--bg-a);border:1px solid var(--gold-dim);color:var(--gold);font-weight:900;font-size:12px;padding:2px 10px;border-radius:20px;font-family:'Manrope',sans-serif;}

  .pname{font-size:24px;font-weight:900;margin:8px 0 4px;letter-spacing:0.3px;text-shadow:0 2px 12px rgba(0,0,0,0.35);}
  .pmeta{color:var(--muted);font-size:12.5px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;}
  .pmeta .dot{opacity:0.5;}
  .pos-pill{display:inline-block;font-size:10.5px;font-weight:900;padding:3px 10px;border-radius:20px;color:#0a1420;}
  .pos-pill.GK{background:linear-gradient(90deg,#ffe27a,#e8b94d);}
  .pos-pill.DF{background:linear-gradient(90deg,#8fd6ff,#4fa8e0);}
  .pos-pill.MF{background:linear-gradient(90deg,#9df0c4,#3fd18a);}
  .pos-pill.FW{background:linear-gradient(90deg,#ffb0b0,#e14b5e);color:#2a0a0c;}

  .price-row{display:flex;align-items:baseline;justify-content:center;gap:7px;margin-bottom:6px;}
  .price-row .euro{font-size:15px;color:var(--gold);font-weight:800;}
  .price-row .amount{font-family:'Anton';font-size:44px;font-weight:400;color:var(--gold);letter-spacing:1px;text-shadow:0 0 20px rgba(240,185,62,0.4);}
  .leader{font-size:13.5px;font-weight:800;margin-bottom:18px;min-height:20px;}
  .leader .lname{color:var(--white);}
  .leader.none{color:var(--muted);font-weight:600;}

  .bid-actions{display:flex;gap:10px;position:relative;z-index:2;}
  .bid-actions .btn{flex:1;}
  .bid-blocked{text-align:center;color:var(--muted);font-size:12.5px;font-weight:700;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .reason{text-align:center;color:#ff9d9d;font-size:12px;font-weight:700;margin-top:9px;min-height:16px;}

  .squad-summary{margin-top:18px;}
  .squad-summary-head{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13.5px;color:var(--muted);padding:6px 3px 11px;}
  .squad-summary-head b{color:var(--white);}
  .squad-summary-head .full-tag{color:var(--crimson);font-size:11px;font-weight:900;}

  .pitch{position:relative;border-radius:18px;padding:16px 10px 12px;overflow:hidden;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 26px, transparent 26px 52px),
      linear-gradient(180deg,#0e3e28,#0a2617 60%, #081c10);
    border:1px solid rgba(255,255,255,0.13);}
  .pitch::before{content:'';position:absolute;left:6%;right:6%;top:50%;height:1px;background:rgba(255,255,255,0.2);}
  .pitch::after{content:'';position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border:1px solid rgba(255,255,255,0.2);border-radius:50%;}
  .pitch-row{position:relative;z-index:1;display:flex;justify-content:space-evenly;align-items:flex-start;margin:10px 0;}
  .slot{width:52px;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .slot-photo{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#0a1f15;border:2px solid var(--gold);box-shadow:0 3px 12px rgba(0,0,0,0.45);}
  .slot-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;}
  .slot-empty{width:40px;height:40px;border-radius:50%;border:2px dashed rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.32);font-weight:900;font-size:16px;}
  .slot-name{font-size:9px;font-weight:800;color:var(--white);text-align:center;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,0.65);}

  .bench-wrap{margin-top:11px;}
  .bench-title{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:7px;display:flex;justify-content:space-between;}
  .bench-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:2px;}
  .bench-chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:50px;}
  .bench-chip .bc-photo{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#0a1f15;border:1px solid var(--line-hi);}
  .bench-chip .bc-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;}
  .bench-chip .bc-name{font-size:8.5px;font-weight:700;color:var(--muted);text-align:center;max-width:50px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bench-empty{color:var(--muted-dim);font-size:11.5px;padding:7px 2px;}

  .role-modal-backdrop{position:fixed;inset:0;background:rgba(3,8,14,0.76);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0 12px 18px;}
  .role-modal{width:100%;max-width:420px;background:linear-gradient(180deg, var(--panel-hi), var(--panel));border:1px solid var(--gold-dim);border-radius:20px;padding:20px;box-shadow:0 -10px 44px rgba(0,0,0,0.55);text-align:center;}
  .role-modal .rm-photo{width:70px;height:70px;border-radius:50%;overflow:hidden;margin:0 auto 10px;border:2px solid var(--gold);}
  .role-modal .rm-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;}
  .role-modal .rm-name{font-weight:900;font-size:17.5px;margin-bottom:3px;}
  .role-modal .rm-sub{color:var(--muted);font-size:12.5px;margin-bottom:16px;line-height:1.5;}
  .role-modal .rm-actions{display:flex;gap:10px;}
  .role-modal .rm-actions .btn{flex:1;}

  .log{margin-top:16px;display:flex;flex-direction:column;gap:6px;max-height:118px;overflow-y:auto;}
  .log-item{font-size:12px;color:var(--muted);background:rgba(0,0,0,0.2);border-radius:9px;padding:7px 11px;border:1px solid rgba(255,255,255,0.03);}
  .log-item b{color:var(--gold);}

  .center-msg{text-align:center;padding:44px 10px;color:var(--muted);font-weight:700;}
  .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.14);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}

  .kickoff-card{text-align:center;padding:38px 24px;}
  .kickoff-count-wrap{display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .kickoff-count{
    width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;

<script>
/* ============ SUPABASE ============ */
const SUPABASE_URL = "https://zzwvqhuyceyzhemmjwvd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6d3ZxaHV5Y2V5emhlbW1qd3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMDEyNjYsImV4cCI6MjEwMTg3NzI2Nn0.7GKoqTKxI1DWny8IcDjmxo9l_1ormHOY8ctA5bbFy8U";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let realtimeChannel = null;

async function getRoom(code){
  try{
    const {data, error} = await sb.from('rooms').select('state').eq('code', code).maybeSingle();
    if(error || !data) return null;
    return data.state;
  }catch(e){ return null; }
}
async function setRoom(code, state){
  try{
    const {error} = await sb.from('rooms').upsert({code, state, updated_at: new Date().toISOString()});
    if(error) console.error('supabase upsert failed', error);
  }catch(e){ console.error('storage set failed', e); }
}

/* ============ ATOMIC ROOM UPDATES (anti-corruption / anti-race) ============
   كل الأكشنز الحساسة (المزايدة، بدء المزاد، تحديد الدكة/الأساسي، قفل الكارت)
   بتعدي من هنا: بنقرا أحدث نسخة من الغرفة، ونكتب بس لو حد تاني ما كتبش فوقها
   من ساعة ما قرينا (compare-and-swap على updated_at). لو حصل تعارض (اتنين
   ضغطوا في نفس اللحظة، أو حصل ريفريش/قطع نت وسط العملية) بنعيد المحاولة
   بدل ما نخرب الحالة أو نضيع فعل حد. */
async function withRoomLock(code, mutator, maxRetries=8){
  for(let attempt=0; attempt<maxRetries; attempt++){
    let row;
    try{
      const {data, error} = await sb.from('rooms').select('state, updated_at').eq('code', code).maybeSingle();
      if(error || !data) return {ok:false, state:null};
      row = data;
    }catch(e){ return {ok:false, state:null}; }

    const state = row.state;
    let mutRes;
    try{ mutRes = await mutator(state); }
    catch(e){ console.error('mutator failed', e); return {ok:false, state}; }
    if(mutRes && mutRes.abort) return {ok:false, state, reason:mutRes.reason};

    const nowIso = new Date().toISOString();
    try{
      const {data:updated, error:updErr} = await sb.from('rooms')
        .update({state, updated_at: nowIso})
        .eq('code', code).eq('updated_at', row.updated_at)
        .select('code');
      if(updErr){ console.error('cas update failed', updErr); return {ok:false, state}; }
      if(updated && updated.length>0) return {ok:true, state};
    }catch(e){ console.error('cas update threw', e); return {ok:false, state}; }
    await new Promise(r=>setTimeout(r, 90 + Math.random()*160));
  }
  return {ok:false, state:null, reason:'max-retries'};
}
// بصمة خفيفة لحالة الغرفة، بنستخدمها عشان منعملش ريفريش/ريندر كامل للشاشة
// (وبالتالي مفيش أي وميض أو فلاش) غير لو الحالة فعلًا اتغيرت.
let lastStateSig = null;
function stateSig(state){ try{ return JSON.stringify(state); }catch(e){ return String(Math.random()); } }
function applyIncomingState(state){
  const sig = stateSig(state);
  if(sig === lastStateSig) return; // مفيش أي تغيير حقيقي — منعيدش بناء الشاشة عشان منولّدش وميض
  lastStateSig = sig;
  checkNewJoins(state);
  localState = state;
  render();
}

function subscribeRoom(code){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
  realtimeChannel = sb.channel('room-'+code)
    .on('postgres_changes', {event:'*', schema:'public', table:'rooms', filter:'code=eq.'+code}, (payload)=>{
      if(payload.new && payload.new.state){
        applyIncomingState(payload.new.state);
      }
    })
    .subscribe();
  renderSocialLayer();
}

/* ============ TOAST: إشعار فوري لما حد ينضم أو يخرج ============
   بيشتغل مباشرة من غير ما يستنى ريفريش أو تنقل بين الشاشات — بيظهر فوق أي
   شاشة إنت فيها (لوبي، مزاد، أو نتيجة)، لحظة ما حد يدخل أو يخرج من الغرفة. */
let knownPlayers = new Set();
let knownLeft = new Set();
let toastQueue = [];
function seedKnownPlayers(state){
  knownPlayers = new Set((state && state.playersOrder) || []);
  knownLeft = new Set();
  if(state && state.players){
    Object.keys(state.players).forEach(n=>{ if(state.players[n].left) knownLeft.add(n); });
  }
}
function checkNewJoins(state){
  if(!state || !state.playersOrder) return;
  state.playersOrder.forEach(n=>{
    if(!knownPlayers.has(n)){
      knownPlayers.add(n);
      if(n!==myName) showToast(`⚽ ${n} دخل الغرفة`);
    }
  });
  // خروج من اللوبي (اتشال من القائمة خالص)
  knownPlayers.forEach(n=>{
    if(n!==myName && !state.playersOrder.includes(n) && !knownLeft.has(n)){
      knownLeft.add(n);
      showToast(`🚪 ${n} غادر الغرفة`);
    }
  });
  // خروج أثناء المزاد (فلاج left)
  if(state.players){
    Object.keys(state.players).forEach(n=>{
      if(state.players[n].left && !knownLeft.has(n)){
        knownLeft.add(n);
        if(n!==myName) showToast(`🚪 ${n} غادر اللعبة`);
      }
    });
  }
}
function showToast(text){
  const id = 't'+Math.random().toString(36).slice(2);
  toastQueue.push({id, text});
  renderToasts();
  setTimeout(()=>{
    toastQueue = toastQueue.filter(t=>t.id!==id);
    renderToasts();
  }, 3200);
}
function renderToasts(){
  let host = document.getElementById('toastHost');
  if(!host){
    host = document.createElement('div');
    host.id = 'toastHost';
    host.className = 'toast-host';
    document.body.appendChild(host);
  }
  host.innerHTML = toastQueue.map(t=>`<div class="toast-pill">${esc(t.text)}</div>`).join('');
}

/* ============ STAR PLAYER DATABASE ============
   قائمة مختارة ومراجعة يدويًا من لاعبين حقيقيين ومعروفين فعلًا (مش عشوائي
   من ويكيبيديا)، بمراكزهم وأنديتهم وتقييم تقريبي لكل واحد. الصورة بس هي
   اللي بتتجاب لايف من ويكيبيديا وقت المزاد (بحث باسم اللاعب)، فلو صورة
   لاعب معينة فشلت لأي سبب بيتم تجاهله بدل ما تظهر صورة مكسورة. */
const STAR_PLAYERS = [

const WIKI_API  = "https://en.wikipedia.org/w/api.php";
const WIKI_REST = "https://en.wikipedia.org/api/rest_v1/page/summary/";

async function wikiSummary(title){
  try{
    const res = await fetch(WIKI_REST + encodeURIComponent(title.replace(/ /g,'_')));
    if(!res.ok) return null;
    const d = await res.json();
    if(d.type === 'disambiguation') return null;
    return d;
  }catch(e){ return null; }
}
async function resolveTitle(query, namespace){
  try{
    const url = `${WIKI_API}?action=query&list=search&srsearch=${encodeURIComponent(query)}&srnamespace=${namespace}&srlimit=1&format=json&origin=*`;
    const res = await fetch(url);
    const data = await res.json();
    const hit = data && data.query && data.query.search && data.query.search[0];
    return hit ? hit.title : null;
  }catch(e){ return null; }
}

function priceForRating(r){
  const t = Math.max(0, Math.min(1, (r-74)/(92-74)));
  const base = 10 + Math.pow(t, 1.55) * 185;
  const jitter = base * (Math.random()*0.16 - 0.08);
  return Math.max(8, Math.round(base + jitter));
}
function tierFor(price){
  if(price>=145) return 'icon';
  if(price>=68) return 'gold';
  if(price>=26) return 'silver';
  return 'bronze';
}
const TIER_LABEL = {bronze:'برونزي', silver:'فضي', gold:'ذهبي', icon:'أيقونة'};

async function fetchPlayerCard(sp){
  try{
    const title = await resolveTitle(sp.n+' footballer', 0);
    const d = await wikiSummary(title || sp.n);
    if(!d || !d.thumbnail || !d.thumbnail.source) return null; // من غير صورة حقيقية، اللاعب ده ما بيدخلش المزاد
    const price = priceForRating(sp.r);
    return {
      id: 'p'+sp.n.replace(/[^a-zA-Z0-9]/g,'')+'_'+Math.random().toString(36).slice(2,7),
      name: sp.n, pos: sp.p, price, tier: tierFor(price), rating: sp.r,
      club: sp.c, league: sp.l, img: d.thumbnail.source, badge: null,
    };
  }catch(e){ return null; }
}

async function buildPlayerPool(onProgress){
  // بنسحب عينة أكبر من اللي محتاجينه عشان أي لاعب تفشل صورته يتعوض تلقائيًا
  const chosen = shuffle(STAR_PLAYERS).slice(0, STAR_PLAYERS.length);
  let pool = [];
  const seen = new Set();
  let done = 0;
  const BATCH = 8;
  for(let i=0;i<chosen.length;i+=BATCH){
    const batch = chosen.slice(i, i+BATCH);
    const results = await Promise.all(batch.map(fetchPlayerCard));
    results.filter(Boolean).forEach(p=>{ if(!seen.has(p.name)){ seen.add(p.name); pool.push(p); } });
    done += batch.length;
    if(onProgress) onProgress(Math.min(done, chosen.length), chosen.length);
    if(pool.length >= MAX_CARDS) break; // كفاية كده، معنداش داعي نكمل نضرب ويكيبيديا أكتر من اللازم
  }
  return pool;
}

function reserveNeeded(squad){
  let need = 0;
  ["GK","DF","MF","FW"].forEach(pos=>{
    const have = squad.filter(s=>s.pos===pos).length;
    const remain = Math.max(0, POS_MIN[pos]-have);
    need += remain*8;
  });
  return need;
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ============ فرق (2ضد2 / 3ضد3): كل الشراء والميزانية بيبقوا مشتركين
   بين أعضاء الفريق. الدالة دي بترجع "المالك" الحقيقي للميزانية والتشكيلة —
   الفريق نفسه في وضع الفرق، أو اللاعب لوحده في الوضع العادي. أي كود تاني
   بيتعامل مع الميزانية/التشكيلة لازم يعدي من هنا عشان يشتغل صح في الحالتين. */
function ownerOf(state, name){
  const p = state.players[name];
  if(!p) return null;
  if(state.mode==='team' && p.teamId && state.teams && state.teams[p.teamId]) return state.teams[p.teamId];
  return p;
}
// كل "الوحدات" المشاركة في المزاد: فرق في وضع الفرق، أو لاعبين في الوضع العادي
function ownerEntries(state){
  if(state.mode==='team' && state.teams){
    return Object.keys(state.teams).map(id=>({id, owner:state.teams[id]}));
  }
  return state.playersOrder.map(n=>({id:n, owner:state.players[n]}));
}
function ownerDisplayName(state, id){
  if(state.mode==='team' && state.teams && state.teams[id]){
    const t = state.teams[id];
    return `${t.name} (${t.members.join('، ')})`;
  }
  return id;
}

/* ============ VALIDATION (shared between UI hints and server-authoritative check) ============
   الدالة دي بترجع سبب المنع (أو null لو مفيش مانع) — بتتستخدم قبل الريندر
   عشان نعطل الزرار ونوضح السبب، وبتتستخدم تاني جوه withRoomLock كمصدر
   الحقيقة النهائي (client hint مش بديل عن السيرفر). */
function bidBlockReason(me, card, state){
  if(!card) return 'مفيش كارت حاليًا.';
  if(me.squad.length >= SQUAD_MAX_TOTAL) return 'تشكيلتك مكتملة (18 لاعب) — مينفعش تزايد تاني.';
  const posCount = me.squad.filter(s=>s.pos===card.pos).length;
  if(posCount >= POS_MAX[card.pos]) return `وصلت للحد الأقصى من ${POS_LABEL[card.pos]}ين (${POS_MAX[card.pos]}).`;
  const inc = incrementFor(state.currentBid);
  const newBid = state.currentBid + inc;
  const hypotheticalSquad = [...me.squad, {pos:card.pos}];
  if(me.budget - newBid < reserveNeeded(hypotheticalSquad)) return 'لازم تسيب فلوس كفاية تكمل بيها باقي التشكيلة.';
  if(state.currentBidder){
    const leaderOwner = ownerOf(state, state.currentBidder);
    if(leaderOwner === me._owner) return state.mode==='team' ? 'فريقك صاحب أعلى مزايدة بالفعل.' : 'إنت صاحب أعلى مزايدة بالفعل.';
  }
  return null;
}

async function confirmExit(){
  if(exiting) return;
  exiting = true;
  renderSocialLayer();
  // ===== نبلّغ باقي اللاعبين إنك خرجت قبل ما نسيب الصفحة، عشان يبان فورًا
  // عندهم إنك مش موجود، مش إنك لسه في الروم =====
  try{
    if(roomCode && myName){
      await withRoomLock(roomCode, (state)=>{
        if(!state.players[myName]) return {abort:true};
        if(state.phase==='lobby'){
          if(state.mode==='team'){
            const tid = state.players[myName].teamId;
            if(tid && state.teams[tid]) state.teams[tid].members = state.teams[tid].members.filter(n=>n!==myName);
          }
          state.playersOrder = state.playersOrder.filter(n=>n!==myName);
          delete state.players[myName];
          if(state.playersOrder.length && !state.playersOrder.some(n=>state.players[n] && state.players[n].host)){
            state.players[state.playersOrder[0]].host = true;
          }
          pushLog(state, `<b>${myName}</b> غادر الغرفة`);
        } else {
          state.players[myName].left = true;
          pushLog(state, `<b>${myName}</b> غادر اللعبة`);
        }
      });
    }
  }catch(e){ console.error('exit sync failed', e); }
  try{ if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; } }catch(e){}
  if(pollTimer) clearInterval(pollTimer);
  if(tickTimer) clearInterval(tickTimer);
  location.href = location.pathname;
}

function pushLog(state, text){
  state.log = state.log || [];
  state.log.unshift(text);
  state.log = state.log.slice(0,8);
}

async function createRoom(name){
  creating = true; render();
  let code, existing;
  for(let i=0;i<5;i++){
    code = genCode();
    existing = await getRoom(code);
    if(!existing) break;
  }
  const isTeam = createMode==='team';
  const teamSize = createTeamSize===3 ? 3 : 2;
  const state = {
    code, phase:'lobby', mode: isTeam?'team':'classic', teamSize: isTeam?teamSize:null,
    playersOrder:[name],
    players:{ [name]: isTeam ? {teamId:'A', host:true} : {budget:START_BUDGET, squad:[], host:true} },
    teams: isTeam ? {
      A:{name:TEAM_META.A.name, cls:TEAM_META.A.cls, members:[name], budget:START_BUDGET, squad:[]},
      B:{name:TEAM_META.B.name, cls:TEAM_META.B.cls, members:[], budget:START_BUDGET, squad:[]},
    } : null,
    pool:[], cardQueue:null, cardIndex:-1, currentCard:null, currentBid:0, currentBidder:null,
    auctionEndsAt:null, settleLock:null, log:[], results:null, resultsStatus:null,
  };
  await setRoom(code, state);
  myName = name; roomCode = code; localState = state; creating=false;
  seedKnownPlayers(state);
  history.replaceState(null,'', location.pathname+'?room='+code);
  startPolling();
  render();
}

let joining = false;
async function joinRoom(code, name, wantTeamId){
  joining = true; joinError = ""; render();
  const first = await getRoom(code);
  if(!first){ joining=false; joinError="مفيش غرفة بالكود ده."; render(); return; }
  const isTeam = first.mode==='team';
  const capacity = isTeam ? first.teamSize*2 : MAX_PLAYERS;

  let finalState = first;
  if(!first.players[name]){
    const res = await withRoomLock(code, (state)=>{
      if(state.players[name]) return;
      if(state.phase!=='lobby') return {abort:true, reason:'started'};
      const cap = state.mode==='team' ? state.teamSize*2 : MAX_PLAYERS;
      if(state.playersOrder.length>=cap) return {abort:true, reason:'full'};
      if(state.mode==='team'){
        let tid = wantTeamId;
        const full = id=> state.teams[id].members.length >= state.teamSize;
        if(!tid || full(tid)) tid = !full('A') ? 'A' : (!full('B') ? 'B' : null);
        if(!tid) return {abort:true, reason:'full'};
        state.players[name] = {teamId:tid, host:false};
        state.teams[tid].members.push(name);
      } else {
        state.players[name] = {budget:START_BUDGET, squad:[], host:false};
      }
      state.playersOrder.push(name);
      pushLog(state, `<b>${name}</b> دخل الغرفة`);
    });
    if(!res.ok){
      joining=false;
      if(res.reason==='started'){ joinError="المزاد بدأ بالفعل، مينفعش تنضم دلوقتي."; render(); return; }
      if(res.reason==='full'){ joinError=isTeam?"الفرق مكتملة بالفعل.":`الغرفة مكتملة (${MAX_PLAYERS} لاعبين).`; render(); return; }
      joinError="حصلت مشكلة في الاتصال، جرب تاني."; render(); return;
    }
    finalState = res.state;
  }
  joining=false;
  myName = name; roomCode = code; localState = finalState;
  seedKnownPlayers(finalState);
  history.replaceState(null,'', location.pathname+'?room='+code);
  startPolling();
  render();
}

// اختيار فريق يدوي جوه اللوبي (قبل بداية المزاد) — أي عضو يقدر يبدّل فريقه
async function chooseTeam(teamId){
  if(!roomCode || !myName) return;
  const res = await withRoomLock(roomCode, (state)=>{
    if(state.mode!=='team' || state.phase!=='lobby') return {abort:true};
    const me = state.players[myName];
    if(!me) return {abort:true};
    if(me.teamId===teamId) return {abort:true};
    if(state.teams[teamId].members.length >= state.teamSize) return {abort:true, reason:'full'};
    if(me.teamId) state.teams[me.teamId].members = state.teams[me.teamId].members.filter(n=>n!==myName);
    me.teamId = teamId;
    state.teams[teamId].members.push(myName);
  });
  if(res.ok) localState = res.state;
  render();
}


function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

/* ============ لعب فردي ضد الـ AI ============
   وضع منفصل بالكامل عن نظام الغرف: مفيش Supabase ولا مزايدة بالوقت — كل واحد
   (اللاعب والـAI) بيبني تشكيلته بميزانية ثابتة (نفس START_BUDGET) في نفس
   الوقت، وأول واحد يخلص (يوصل للحد الأدنى ويضغط "إنهاء" أو يوصل 18 لاعب)
   بتقفل الجولة وبيتعمل تقييم ومقارنة نهائية. */
function aiPickScore(sp, need){
  // قيمة تقريبية للاعب بالنسبة للسعر، مع أفضلية لسد المراكز الناقصة
  const valueRatio = sp.rating / Math.max(8, sp.price);
  const urgency = need ? 1.6 : 1;
  return valueRatio * urgency;
}
function aiBestPick(aiG){
  const taken = new Set([...aiG.mySquad, ...aiG.aiSquad].map(x=>x.id));
  const candidates = aiG.pool.filter(c=>!taken.has(c.id));
  if(!candidates.length) return null;
  const posCounts = {GK:0,DF:0,MF:0,FW:0};
  aiG.aiSquad.forEach(x=>posCounts[x.pos]++);
  let best = null, bestScore = -1;
  for(const c of candidates){
    if(aiG.aiSquad.length >= SQUAD_MAX_TOTAL) break;
    if(posCounts[c.pos] >= POS_MAX[c.pos]) continue;
    const hypotheticalSquad = [...aiG.aiSquad, {pos:c.pos}];
    if(aiG.aiBudget - c.price < reserveNeeded(hypotheticalSquad)) continue;
    const need = posCounts[c.pos] < POS_MIN[c.pos];
    const score = aiPickScore(c, need);
    if(score > bestScore){ bestScore = score; best = c; }
  }
  return best;
}
function aiSquadValid(squad){
  if(squad.length < SQUAD_MIN_TOTAL) return false;
  return ["GK","DF","MF","FW"].every(pos=> squad.filter(s=>s.pos===pos).length >= POS_MIN[pos]);
}
function aiAutoRole(squad, entry){
  const startersInPos = squad.filter(x=>x.role==='start' && x.pos===entry.pos).length;
  return startersInPos < STARTER_MAX[entry.pos] ? 'start' : 'bench';
}
function aiTick(){
  const g = aiGame;
  if(!g || g.phase!=='building' || g.aiDone) return;
  const pick = aiBestPick(g);
  if(!pick || g.aiSquad.length>=SQUAD_MAX_TOTAL){
    g.aiDone = true;
  } else {
    const entry = {id:pick.id, name:pick.name, pos:pick.pos, club:pick.club, league:pick.league, price:pick.price, img:pick.img, role:null};
    entry.role = aiAutoRole(g.aiSquad, entry);
    g.aiSquad.push(entry);
    g.aiBudget -= pick.price;
    g.aiLog = [`🤖 الـAI اشترى ${pick.name} (${POS_LABEL[pick.pos]}) بـ €${pick.price}م`, ...g.aiLog].slice(0,5);
    if(g.aiSquad.length >= SQUAD_MAX_TOTAL || (!aiBestPick(g) && aiSquadValid(g.aiSquad))) g.aiDone = true;
  }
  maybeEndAIGame();
  render();
}
function maybeEndAIGame(){
  const g = aiGame;
  if(!g || g.phase!=='building') return;
  const myFull = g.mySquad.length >= SQUAD_MAX_TOTAL;
  const aiFull = g.aiDone && g.aiSquad.length >= SQUAD_MAX_TOTAL;
  if(myFull || aiFull || (g.myFinished && g.aiDone)){
    endAIGame();
  }
}
function endAIGame(){
  const g = aiGame;
  if(!g || g.phase!=='building') return;
  g.phase = 'whistle';
  if(aiTimer){ clearInterval(aiTimer); aiTimer=null; }
  // أي كروت لسه من غير دور (نادر) بتتوزع تلقائي
  [g.mySquad, g.aiSquad].forEach(squad=>{
    squad.forEach(x=>{ if(x.role===null) x.role = aiAutoRole(squad, x); });
  });
  if(!aiWhistlePlayed){ aiWhistlePlayed = true; playWhistleSound(); }
  runAISoloRanking(g);
}
let aiWhistlePlayed = false;
async function runAISoloRanking(g){
  try{
    const squadsSummary = [
      {managerName:g.myName, remainingBudget:g.myBudget, totalPlayers:g.mySquad.length, squad:g.mySquad.map(s=>({name:s.name, position:POS_LABEL[s.pos], club:s.club, pricePaid:s.price}))},
      {managerName:'الـ AI', remainingBudget:g.aiBudget, totalPlayers:g.aiSquad.length, squad:g.aiSquad.map(s=>({name:s.name, position:POS_LABEL[s.pos], club:s.club, pricePaid:s.price}))},
    ];
    const prompt = `انت خبير تحليل كرة قدم. تحت تشكيلتين اتبنوا في نفس الوقت بنفس الميزانية (3 مليار يورو لكل واحدة) من لاعبين حقيقيين ومعروفين فعليًا: تشكيلة لاعب بشري وتشكيلة بناها نظام AI. قيّم كل تشكيلة من ناحية: جودة اللاعبين، التوازن بين الخطوط (حراسة/دفاع/وسط/هجوم)، الكيمياء المحتملة، والقيمة مقابل المصاريف. رتبهم من الأفضل للأضعف.
البيانات:
${JSON.stringify(squadsSummary, null, 2)}
رد فقط بصيغة JSON صحيحة بدون أي نص إضافي أو Markdown، بالشكل ده بالظبط:
{"ranking":[{"managerName":"...","place":1,"score":87,"verdict":"تحليل من جملتين او تلاتة بالعربي عن نقاط القوة والضعف"}],"overall":"فقرة قصيرة بالعربي تشرح ليه صاحب المركز الأول فاز وتقارن بسرعة بين التشكيلتين"}`;
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1200, messages:[{role:"user", content:prompt}] })
    });
    const data = await response.json();
    let text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    text = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(text);
    aiGame.results = parsed; aiGame.phase='results'; render();
  }catch(e){
    console.error('AI solo ranking failed', e);
    const scoreOf = (squad)=>{
      const totalSpent = squad.reduce((s,x)=>s+x.price,0);
      const balance = ["GK","DF","MF","FW"].every(pos=>squad.filter(s=>s.pos===pos).length >= (POS_MIN[pos]-2));
      const avgRating = squad.length? Math.round(squad.reduce((s,x)=>s+(x.rating||80),0)/squad.length) : 0;
      return Math.round(totalSpent/6 + avgRating/2 + (balance?10:0));
    };
    const myScore = scoreOf(g.mySquad), aiScore = scoreOf(g.aiSquad);
    const ranking = [
      {managerName:g.myName, score:myScore, verdict:"تعذر الوصول لنظام التحليل، ده تقييم مبسط بناءً على قيمة وتوازن التشكيلة."},
      {managerName:'الـ AI', score:aiScore, verdict:"تعذر الوصول لنظام التحليل، ده تقييم مبسط بناءً على قيمة وتوازن التشكيلة."},
    ].sort((a,b)=>b.score-a.score).map((r,i)=>({...r, place:i+1}));
    aiGame.results = {ranking, overall:"تعذر الاتصال بخدمة التحليل، فالترتيب ده مبني على قيمة وتوازن كل تشكيلة."};
    aiGame.phase = 'results'; render();
  }
}

async function startAISolo(name){
  aiStarting = true; aiStartFailed = ""; aiProgressText = "بنجهز نجوم الموسم..."; render();
  const pool = await buildPlayerPool((done,total)=>{
    aiProgressText = `بنجهز اللاعبين... (${done}/${total})`;
    render();
  });
  if(pool.length < 12){
    aiStarting = false;
    aiStartFailed = "تعذر تحميل صور اللاعبين من المصدر، جرب تاني كمان شوية.";
    render();
    return;
  }
  aiWhistlePlayed = false;
  aiGame = {
    myName: name, pool: shuffle(pool),
    mySquad: [], aiSquad: [], myBudget: START_BUDGET, aiBudget: START_BUDGET,
    aiLog: [], aiDone:false, myFinished:false, filter:'ALL', phase:'building', results:null,
  };
  aiStarting = false;
  render();
  aiTimer = setInterval(aiTick, 1100);
}

function aiBuyBlockReason(g, card){
  if(g.mySquad.length >= SQUAD_MAX_TOTAL) return 'تشكيلتك مكتملة (18 لاعب).';
  const posCount = g.mySquad.filter(s=>s.pos===card.pos).length;
  if(posCount >= POS_MAX[card.pos]) return `وصلت للحد الأقصى من ${POS_LABEL[card.pos]}ين.`;
  const hypotheticalSquad = [...g.mySquad, {pos:card.pos}];
  if(g.myBudget - card.price < reserveNeeded(hypotheticalSquad)) return 'مش هتفضل معاك فلوس كفاية تكمل بيها التشكيلة.';
  if(g.myBudget < card.price) return 'مش معاك ميزانية كفاية.';
  return null;
}
function aiBuyCard(cardId){
  const g = aiGame;
  if(!g || g.phase!=='building') return;
  const taken = new Set([...g.mySquad, ...g.aiSquad].map(x=>x.id));
  if(taken.has(cardId)) return;
  const card = g.pool.find(c=>c.id===cardId);
  if(!card) return;
  if(aiBuyBlockReason(g, card)) return;
  g.myBudget -= card.price;
  g.mySquad.push({id:card.id, name:card.name, pos:card.pos, club:card.club, league:card.league, price:card.price, img:card.img, role:null});
  render();
}
function aiAssignRole(playerId, role){
  const g = aiGame;
  if(!g) return;
  const entry = g.mySquad.find(x=>x.id===playerId && x.role===null);
  if(!entry) return;
  const r = resolveRole(g.mySquad, entry, role);
  if(r===null) return;
  entry.role = r;
  maybeEndAIGame();
  render();
}
function finishAISquad(){
  const g = aiGame;
  if(!g || g.phase!=='building') return;
  if(g.mySquad.length < SQUAD_MIN_TOTAL) return;
  g.myFinished = true;
  endAIGame();
}
function exitAIGame(){
  if(aiTimer){ clearInterval(aiTimer); aiTimer=null; }
  aiGame = null;
  location.href = location.pathname;
}

// عداد بداية احترافي ولحظي: بيتخزن في حالة الغرفة المشتركة (kickoffAt) عشان
// كل اللاعبين (المشرف والأعضاء) يشوفوا نفس العد التنازلي في نفس اللحظة بالظبط،
// مش بس المشرف. أي حد فاتح الصفحة هيستقبل التحديث فورًا عن طريق الـ Realtime.
const KICKOFF_STEP_MS = 800;
const KICKOFF_STEPS = 3; // 3, 2, 1
const KICKOFF_TOTAL_MS = KICKOFF_STEP_MS*KICKOFF_STEPS;
let kickoffTriggered = false;

function roomReadyToStart(state){
  if(state.mode==='team'){
    return state.teams && state.teams.A.members.length===state.teamSize && state.teams.B.members.length===state.teamSize;
  }
  return state.playersOrder.length>=2;
}
async function requestKickoff(){
  const s = localState;
  if(!s || s.kickoffAt || !roomReadyToStart(s)) return;
  await withRoomLock(roomCode, (state)=>{
    if(state.phase!=='lobby') return {abort:true};
    if(state.kickoffAt) return {abort:true};
    if(!roomReadyToStart(state)) return {abort:true};
    state.kickoffAt = Date.now();
  });
}

async function startAuction(){
  startingAuction = true; startFailed = ""; startProgressText = "بنجهز نجوم الموسم..."; render();
  const pool = await buildPlayerPool((done,total)=>{
    startProgressText = `بنجهز اللاعبين... (${done}/${total})`;
    render();
  });
  if(pool.length < 12){
    startingAuction = false;
    startFailed = "تعذر تحميل صور اللاعبين من المصدر، جرب تاني كمان شوية.";
    kickoffTriggered = false;
    await withRoomLock(roomCode, (state)=>{ if(state.phase==='lobby') state.kickoffAt = null; });
    render();
    return;
  }
  const shuffledPool = shuffle(pool);
  const res = await withRoomLock(roomCode, (state)=>{
    if(state.phase!=='lobby') return {abort:true};
    if(!roomReadyToStart(state)) return {abort:true};
    // بنثبّت ميزانية كل الوحدات (لاعبين أو فرق) على نفس الرقم لحظة البدء —
    // بيمنع أي فرق ميزانية ممكن يحصل لو حد فتح نسخة قديمة من الصفحة (كاش
    // المتصفح) قبل ما ينضم. كله بياخد بالظبط START_BUDGET من غير أي استثناء.
    if(state.mode==='team'){
      state.teams.A.budget = START_BUDGET; state.teams.A.squad = [];
      state.teams.B.budget = START_BUDGET; state.teams.B.squad = [];
    } else {
      state.playersOrder.forEach(n=>{ if(state.players[n]) state.players[n].budget = START_BUDGET; });
    }
    state.pool = shuffledPool;
    state.cardQueue = shuffledPool.map((_,i)=>i).slice(0, Math.min(shuffledPool.length, MAX_CARDS));
    state.cardIndex = 0;
    state.currentCard = shuffledPool[state.cardQueue[0]];
    state.currentBid = state.currentCard.price;
    state.currentBidder = null;
    state.auctionEndsAt = Date.now() + BID_SECONDS_OPEN*1000;
    state.auctionWindowSeconds = BID_SECONDS_OPEN;
    state.kickoffAt = null;
    state.phase = 'auction';
    pushLog(state, `بدأ المزاد! أول كارت: <b>${state.currentCard.name}</b>`);
  });
  if(res.ok) localState = res.state;
  startingAuction=false; render();
}

let bidding = false;
async function placeBid(mult){
  if(bidding) return;
  const s0 = localState;
  const owner0 = s0 && ownerOf(s0, myName);
  const card0 = s0 && s0.currentCard;
  if(!s0 || !owner0 || !card0 || s0.phase!=='auction' || Date.now()>=s0.auctionEndsAt) return;

  // فحص فوري قبل أي اتصال بالسيرفر — لو فيه مانع واضح، بنوريه فورًا من غير انتظار
  const preReason = bidBlockReason(Object.assign({_name:myName, _owner:owner0}, owner0), card0, s0);
  if(preReason){ bidError = preReason; render(); return; }

  const inc0 = incrementFor(s0.currentBid) * mult;
  const optimisticBid = s0.currentBid + inc0;

  // ===== تحديث تفاؤلي فوري: بيظهر على شاشتك في نفس اللحظة اللي بتدوس فيها،
  // من غير ما تستنى رد السيرفر. لو السيرفر رفض العملية (حد سبقك مثلاً)
  // هيترجع للحالة الحقيقية تلقائيًا بعد شوية. =====
  bidding = true;
  bidError = "";
  const optimisticEndsAt = Date.now() + BID_SECONDS_CLOSING*1000;
  localState = Object.assign({}, s0, {currentBid: optimisticBid, currentBidder: myName, auctionEndsAt: optimisticEndsAt, auctionWindowSeconds: BID_SECONDS_CLOSING});
  render();

  let localErr = "";
  const res = await withRoomLock(roomCode, (state)=>{
    localErr = "";
    if(state.phase!=='auction') return {abort:true};
    if(Date.now() >= state.auctionEndsAt) return {abort:true};
    const owner = ownerOf(state, myName);
    if(!owner) return {abort:true};
    const card = state.currentCard;
    const reason = bidBlockReason(Object.assign({_name:myName, _owner:owner}, owner), card, state);
    if(reason){ localErr = reason; return {abort:true}; }

    const inc = incrementFor(state.currentBid) * mult;
    const newBid = state.currentBid + inc;
    const posCount = owner.squad.filter(s=>s.pos===card.pos).length;
    if(owner.squad.length >= SQUAD_MAX_TOTAL){ localErr="التشكيلة مكتملة (18 لاعب)."; return {abort:true}; }
    if(posCount >= POS_MAX[card.pos]){ localErr=`وصلتوا للحد الأقصى من ${POS_LABEL[card.pos]}ين.`; return {abort:true}; }
    const hypotheticalSquad = [...owner.squad, {pos:card.pos}];
    if(owner.budget - newBid < reserveNeeded(hypotheticalSquad)){ localErr="لازم تسيبوا فلوس كفاية تكملوا بيها التشكيلة."; return {abort:true}; }

    state.currentBid = newBid;
    state.currentBidder = myName;
    // كل مزايدة بتصفّر عداد الإغلاق لـ5 ثواني — كده محدش يقدر ياخد صفقة بمزايدة في آخر جزء من الثانية
    // من غير ما يدي فرصة عادلة للباقي يردوا عليه.
    state.auctionEndsAt = Date.now() + BID_SECONDS_CLOSING*1000;
    state.auctionWindowSeconds = BID_SECONDS_CLOSING;
  });
  if(res.ok) localState = res.state;
  else if(res.state) localState = res.state; // رجوع للحالة الحقيقية لو العملية اتلغت
  bidError = localErr;
  bidding = false;
  render();
}

function allFull(state){
  return ownerEntries(state).every(e=>e.owner.squad.length >= SQUAD_MAX_TOTAL);
}
// اللعبة تخلص فور ما أول تشكيلة (فرد أو فريق) تكتمل (18 لاعب) — مش لازم نستنى الكل
function anyFull(state){
  return ownerEntries(state).some(e=>e.owner.squad.length >= SQUAD_MAX_TOTAL);
}

let roleAssigning = false;
function resolveRole(squad, entry, role){
  let r = role;
  if(r==='start'){
    const startersInPos = squad.filter(x=>x.role==='start' && x.pos===entry.pos).length;
    if(startersInPos >= STARTER_MAX[entry.pos]) r = 'bench'; // خانات المركز مكتملة، ينزل الدكة تلقائيًا
  }
  if(r==='bench'){
    const benchCount = squad.filter(x=>x.role==='bench').length;
    if(benchCount >= BENCH_MAX){
      // الدكة مكتملة فعلًا — نحاول نلاقي مكان أساسي بدل ما نرفض العملية
      const startersInPos = squad.filter(x=>x.role==='start' && x.pos===entry.pos).length;
      if(startersInPos < STARTER_MAX[entry.pos]) r = 'start';
      else return null; // مفيش مكان خالص
    }
  }
  return r;
}
async function assignRole(playerId, role){
  if(roleAssigning) return;
  const s0 = localState;
  const owner0 = s0 && ownerOf(s0, myName);
  if(!s0 || !owner0) return;
  const entry0 = owner0.squad.find(x=>x.id===playerId && x.role===null);
  if(!entry0) return;
  const resolved0 = resolveRole(owner0.squad, entry0, role);
  if(resolved0===null) return;

  // ===== تحديث تفاؤلي فوري: الكارت بينزل مكانه على طول من غير انتظار السيرفر =====
  roleAssigning = true;
  const newSquad = owner0.squad.map(x=> x.id===playerId ? Object.assign({}, x, {role: resolved0}) : x);
  if(s0.mode==='team'){
    const myTeamId = s0.players[myName].teamId;
    const newTeam = Object.assign({}, owner0, {squad: newSquad});
    localState = Object.assign({}, s0, {teams: Object.assign({}, s0.teams, {[myTeamId]: newTeam})});
  } else {
    const newMe = Object.assign({}, owner0, {squad: newSquad});
    localState = Object.assign({}, s0, {players: Object.assign({}, s0.players, {[myName]: newMe})});
  }
  render();

  const res = await withRoomLock(roomCode, (state)=>{
    const owner = ownerOf(state, myName);
    if(!owner) return {abort:true};
    const entry = owner.squad.find(x=>x.id===playerId && x.role===null);
    if(!entry) return {abort:true};
    const r = resolveRole(owner.squad, entry, role);
    if(r===null) return {abort:true, reason:'bench-full'};
    entry.role = r;
    pushLog(state, `<b>${myName}</b> نزّل ${entry.name} ${r==='start'? 'أساسي':'على الدكة'}`);
  });
  if(res.ok) localState = res.state;
  else if(res.state) localState = res.state; // رجوع للحالة الحقيقية لو العملية اتلغت
  roleAssigning = false;
  render();
}

let settlingInFlight = false;
async function settleTick(){
  if(!localState || localState.phase!=='auction') return;
  if(Date.now() < localState.auctionEndsAt) return;
  if(settlingInFlight) return;
  settlingInFlight = true;

  const lockId = Math.random().toString(36).slice(2);
  const claim = await withRoomLock(roomCode, (state)=>{
    if(state.phase!=='auction') return {abort:true};
    if(Date.now() < state.auctionEndsAt) return {abort:true};
    state.phase = 'settling';
    state.settleLock = {id:lockId, at:Date.now()};
  });
  if(!claim.ok){ if(claim.state) localState = claim.state; settlingInFlight=false; render(); return; }

  let state = claim.state;
  const card = state.currentCard;
  if(state.currentBidder){
    const buyer = ownerOf(state, state.currentBidder);
    buyer.budget -= state.currentBid;
    buyer.squad.push({id:card.id, name:card.name, pos:card.pos, club:card.club, league:card.league, price:state.currentBid, img:card.img, role:null});
    const buyerLabel = state.mode==='team' ? `<b>${state.currentBidder}</b> لصالح ${state.teams[state.players[state.currentBidder].teamId].name}` : `<b>${state.currentBidder}</b>`;
    pushLog(state, `${buyerLabel} اشترى ${card.name} بـ €${state.currentBid}م`);
  } else {
    pushLog(state, `${card.name} خرج من المزاد من غير ما حد يشتريه`);
  }

  const nextIndex = state.cardIndex + 1;
  const full = anyFull(state);
  if(nextIndex >= state.cardQueue.length || full){
    ownerEntries(state).forEach(({owner})=>{
      owner.squad.forEach(x=>{
        if(x.role===null){
          const startersInPos = owner.squad.filter(y=>y.role==='start' && y.pos===x.pos).length;
          x.role = startersInPos < STARTER_MAX[x.pos] ? 'start' : 'bench';
        }
      });
    });
    state.phase = 'results';
    state.currentCard = null;
    state.currentBidder = null;
    state.settleLock = null;
    state.resultsStatus = 'pending';
    await setRoom(roomCode, state);
    localState = state; settlingInFlight=false; render();
    runAIRanking(state);
    return;
  }

  state.cardIndex = nextIndex;
  state.currentCard = state.pool[state.cardQueue[nextIndex]];
  state.currentBid = state.currentCard.price;
  state.currentBidder = null;
  state.auctionEndsAt = Date.now() + BID_SECONDS_OPEN*1000;
  state.auctionWindowSeconds = BID_SECONDS_OPEN;
  state.settleLock = null;
  state.phase = 'auction';
  await setRoom(roomCode, state);
  localState = state; settlingInFlight=false; render();
}

async function runAIRanking(state){
  try{
    const entries = ownerEntries(state);
    const squadsSummary = entries.map(({id, owner})=>{
      return {
        managerName: ownerDisplayName(state, id),
        remainingBudget: owner.budget,
        totalPlayers: owner.squad.length,
        squad: owner.squad.map(s=>({name:s.name, position:POS_LABEL[s.pos], club:s.club, pricePaid:s.price}))
      };
    });
    const prompt = `انت خبير تحليل كرة قدم. تحت تشكيلات ${entries.length} ${state.mode==='team'?'فرق':'مديرين'} اشتروها في مزاد لاعبين حقيقيين ومعروفين فعليًا (كل واحد كان معاه 3 مليار يورو). قيّم كل تشكيلة من ناحية: جودة اللاعبين، التوازن بين الخطوط (حراسة/دفاع/وسط/هجوم)، الكيمياء المحتملة، والقيمة مقابل المصاريف. رتبهم من الأفضل للأضعف.

البيانات:
${JSON.stringify(squadsSummary, null, 2)}

رد فقط بصيغة JSON صحيحة بدون أي نص إضافي أو Markdown، بالشكل ده بالظبط:
{"ranking":[{"managerName":"...","place":1,"score":87,"verdict":"تحليل من جملتين او تلاتة بالعربي عن نقاط القوة والضعف"}],"overall":"فقرة قصيرة بالعربي تشرح ليه صاحب المركز الأول فاز وتقارن بسرعة بين الفرق"}`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        messages: [{role:"user", content: prompt}]
      })
    });
    const data = await response.json();
    let text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    text = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(text);

    const fresh = await getRoom(roomCode);
    if(fresh && fresh.phase==='results'){
      fresh.results = parsed;
      fresh.resultsStatus = 'done';
      await setRoom(roomCode, fresh);
      localState = fresh; render();
    }
  }catch(e){
    console.error('AI ranking failed', e);
    const fallback = {
      ranking: ownerEntries(state).map(({id, owner})=>{
        const totalSpent = owner.squad.reduce((s,x)=>s+x.price,0);
        const balance = ["GK","DF","MF","FW"].every(pos=>owner.squad.filter(s=>s.pos===pos).length >= (POS_MIN[pos]-2));
        const score = Math.round(totalSpent/4 + (balance?15:0));
        return {managerName:ownerDisplayName(state,id), place:0, score, verdict:"تعذر الوصول لنظام التحليل، ده تقييم مبسط بناءً على قيمة التشكيلة."};
      }).sort((a,b)=>b.score-a.score).map((r,i)=>({...r, place:i+1})),
      overall: "تعذر الاتصال بخدمة التحليل، فالترتيب ده مبني على إجمالي قيمة اللاعبين اللي اشتراهم كل مدير."
    };
    const fresh = await getRoom(roomCode);
    if(fresh && fresh.phase==='results'){
      fresh.results = fallback;
      fresh.resultsStatus = 'done';
      await setRoom(roomCode, fresh);
      localState = fresh; render();
    }
  }
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  if(tickTimer) clearInterval(tickTimer);
  subscribeRoom(roomCode);
  pollTimer = setInterval(async ()=>{
    if(!roomCode) return;
    const s = await getRoom(roomCode);
    if(s) applyIncomingState(s);
  }, 4000);
  tickTimer = setInterval(()=>{
    settleTick();
    if(localState && localState.phase==='auction') renderTimerOnly();
    if(localState && localState.phase==='lobby' && localState.kickoffAt){
      renderKickoffOnly();
      const isHost = localState.players[myName] && localState.players[myName].host;
      const remaining = kickoffRemaining(localState.kickoffAt);
      if(isHost && remaining===0 && !kickoffTriggered && !startingAuction){
        kickoffTriggered = true;
        startAuction();
      }
    } else {
      kickoffTriggered = false;
    }
  }, 300);
}

/* ============ RENDER ============ */
const app = document.getElementById('app');
const footerNote = document.getElementById('footerNote');

function esc(s){ return (s||'').replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function imgAttrs(src){ return `src="${esc(src||PLACEHOLDER_IMG)}" onerror="this.onerror=null;this.src='${PLACEHOLDER_IMG}';"`; }

function render(){
  if(aiGame){ renderAIRoot(); return; }
  footerNote.textContent = roomCode ? `غرفة رقم ${roomCode} — لاعبين حقيقيين ومعروفين، وأسعارهم بتتحدد وقت المزاد` : 'مزاد لاعبين كرة قدم حقيقيين — العب مع أصحابك أو لوحدك';  
  document.body.classList.toggle('stage-lobby', !!(localState && localState.phase==='lobby'));
  document.body.classList.toggle('stage-landing', !roomCode);

  if(!roomCode){ renderLanding(); return; }
  if(!localState){ app.innerHTML = `<div class="card"><div class="center-msg"><div class="spinner"></div>بنجهز الغرفة...</div></div>`; return; }

  if(localState.phase==='lobby') renderLobby();
  else if(localState.phase==='auction' || localState.phase==='settling') renderAuction();
  else if(localState.phase==='results') renderResults();
}

      <div class="field"><label>كود الغرفة</label><input type="text" id="jCode" placeholder="مثال: 4821" maxlength="4" inputmode="numeric" value="${urlRoom||''}"></div>
      <div class="field"><label>اسمك</label><input type="text" id="jName" placeholder="اكتب اسمك" maxlength="16"></div>

      ${joinError? `<div class="err">${esc(joinError)}</div>` : ''}
    `;
    const jCode = document.getElementById('jCode');
    jCode.oninput = ()=>{ jCode.value = jCode.value.replace(/[^0-9]/g,'').slice(0,4); };
    document.getElementById('jBtn').onclick = ()=>{
      if(joining) return;
      const code = jCode.value.trim();
      const name = document.getElementById('jName').value.trim();
      if(code.length!==4 || !name) return;

  }
}

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject)=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    }catch(e){ reject(e); }
  });
}

function kickoffRemaining(kickoffAt){
  const elapsed = Date.now() - kickoffAt;
  const step = Math.floor(Math.max(0,elapsed)/KICKOFF_STEP_MS);
  return Math.max(0, KICKOFF_STEPS - step);
}
// بيحدّث رقم العداد جوه العنصر الموجود بس (من غير ما يعيد بناء الشاشة كلها)
// عشان محدش يشوف أي وميض أو فلاش في العدّاد وهو بيتحدّث كل شوية.
function renderKickoffOnly(){
  const s = localState;
  if(!s || !s.kickoffAt) return;
  const numEl = document.getElementById('kickoffNum');
  const titleEl = document.getElementById('kickoffTitle');
  if(!numEl) return;
  const remaining = kickoffRemaining(s.kickoffAt);
  const label = remaining===0 ? '⚽' : String(remaining);
  if(numEl.textContent !== label){
    numEl.textContent = label;
    numEl.classList.toggle('go', remaining===0);
    if(titleEl) titleEl.textContent = remaining===0 ? 'انطلقنا!' : 'المزاد هيبدأ خلال...';
  }
}

function timeFrac(){
  if(!localState || !localState.auctionEndsAt) return 0;
  const remain = localState.auctionEndsAt - Date.now();
  const windowSecs = localState.auctionWindowSeconds || BID_SECONDS_OPEN;
  return Math.max(0, Math.min(1, remain/(windowSecs*1000)));
}
function renderTimerOnly(){
  const ring = document.getElementById('ringFg');
  const secsEl = document.getElementById('secsLeft');
  if(!ring || !secsEl) return;
  const frac = timeFrac();
  const R = 58, C = 2*Math.PI*R;
  ring.style.strokeDashoffset = C*(1-frac);
  ring.style.stroke = frac < 0.25 ? 'var(--crimson)' : 'var(--gold)';
  const secs = Math.ceil((localState.auctionEndsAt - Date.now())/1000);
  secsEl.textContent = Math.max(0, secs);
}

function renderPitchHTML(squad){
  const rows = PITCH_ROWS.map(pos=>{
    const starters = squad.filter(x=>x.pos===pos && x.role==='start');
    const slots = [];
    for(let i=0;i<STARTER_MAX[pos];i++){
      const p = starters[i];
      slots.push(p
        ? `<div class="slot"><div class="slot-photo"><img ${imgAttrs(p.img)} alt=""></div><div class="slot-name">${esc(p.name)}</div></div>`
        : `<div class="slot"><div class="slot-empty">+</div><div class="slot-name">${POS_LABEL[pos]}</div></div>`);
    }
    return `<div class="pitch-row">${slots.join('')}</div>`;
  }).join('');
  const bench = squad.filter(x=>x.role==='bench');
  const benchHTML = bench.length
    ? bench.map(p=>`<div class="bench-chip"><div class="bc-photo"><img ${imgAttrs(p.img)} alt=""></div><div class="bc-name">${esc(p.name)}</div></div>`).join('')
    : `<div class="bench-empty">الدكة لسه فاضية</div>`;
  return `
    <div class="pitch">${rows}</div>
    <div class="bench-wrap">
      <div class="bench-title"><span>الدكة (${bench.length}/${BENCH_MAX})</span>${bench.length>=BENCH_MAX?'<span style="color:var(--crimson);">مكتملة</span>':''}</div>
      <div class="bench-row">${benchHTML}</div>
    </div>
  `;
}

function attachTilt(){
  const el = document.querySelector('.jumbo');
  if(!el || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const move = (e)=>{
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left)/r.width - 0.5;
    const py = (e.clientY - r.top)/r.height - 0.5;
    el.style.transform = `perspective(900px) rotateY(${px*6}deg) rotateX(${-py*6}deg)`;
  };
  const reset = ()=>{ el.style.transform = 'perspective(900px) rotateY(0deg) rotateX(0deg)'; };
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseleave', reset);
}

let whistlePlayed = false;
function playWhistleSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const now = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(2200, now);
    o.frequency.linearRampToValueAtTime(2600, now+0.12);
    o.frequency.linearRampToValueAtTime(2200, now+0.24);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.22, now+0.02);
    g.gain.setValueAtTime(0.22, now+0.30);
    g.gain.linearRampToValueAtTime(0.0001, now+0.42);
    o.connect(g); g.connect(ctx.destination);
    o.start(now); o.stop(now+0.5);
    o.onended = ()=>{ try{ ctx.close(); }catch(e){} };
  }catch(e){ /* المتصفح مش بيدعم الصوت — مش مشكلة */ }
}

  app.innerHTML = `

  `;
  document.getElementById('newGameBtn').onclick = ()=>{ location.href = location.pathname; };
}
