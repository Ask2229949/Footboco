<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>سوق الانتقالات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Anton&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --night:#050D09;
    --pitch:#0C2418;
    --panel:#0F2E1E;
    --panel-hi:#153A26;
    --line: rgba(234,244,236,0.09);
    --gold:#E8B94D;
    --gold-hi:#FFE3A0;
    --gold-dim:#7a5f24;
    --white:#EAF4EC;
    --muted:#8fae9c;
    --crimson:#E14B5E;
    --bronze:#B27A46;
    --silver:#C7CDD6;
    --icon1:#7B4FE0;
    --icon2:#20C9C0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(232,185,77,0.09), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 110%, rgba(123,79,224,0.08), transparent 55%),
      repeating-linear-gradient(90deg, var(--night) 0 46px, var(--pitch) 46px 92px);
    color:var(--white);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
  }
  .display{font-family:'Anton','Tajawal',sans-serif; letter-spacing:0.5px;}
  .wrap{max-width:960px;margin:0 auto;padding:16px 14px 60px;}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;padding:22px 0 16px;}
  .brand .ball{font-size:24px;filter:drop-shadow(0 0 8px rgba(232,185,77,0.5));}
  .brand h1{font-size:21px;font-weight:900;letter-spacing:0.5px;margin:0;
    background:linear-gradient(180deg,var(--white),#c9dccf);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand .tag{font-size:10.5px;color:var(--night);font-weight:800;background:linear-gradient(180deg,var(--gold-hi),var(--gold));padding:3px 9px;border-radius:20px;box-shadow:0 3px 10px rgba(232,185,77,0.25);}

  .card{background:linear-gradient(180deg, var(--panel-hi), var(--panel));border:1px solid var(--line);border-radius:20px;padding:22px;
    box-shadow:0 16px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    animation:cardIn .32s cubic-bezier(.2,.8,.2,1);}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(0.99);}to{opacity:1;transform:translateY(0) scale(1);}}
  @media (prefers-reduced-motion: reduce){ .card{animation:none;} }

  h2{font-size:18px;font-weight:800;margin:0 0 4px;}
  p.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px;line-height:1.6;}

  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{flex:1;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-weight:700;color:var(--muted);background:rgba(0,0,0,0.18);}
  .tab.active{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#241c00;border-color:var(--gold);}

  label{font-size:12.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:6px;}
  input[type=text]{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
    background:rgba(0,0,0,0.2);color:var(--white);font-family:inherit;font-size:16px;font-weight:700;
    outline:none;letter-spacing:1px;
  }
  input[type=text]:focus{border-color:var(--gold);}
  input[type=text]::placeholder{color:#4d6657;font-weight:500;}

  .field{margin-bottom:14px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 18px;border-radius:12px;border:none;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:14.5px;transition:transform .12s ease, filter .12s ease;
    width:100%;
  }
  .btn:active{transform:scale(0.98);}
  .btn-gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#241c00;box-shadow:0 6px 18px rgba(232,185,77,0.25);}
  .btn-gold:not(:disabled):hover{filter:brightness(1.05);box-shadow:0 8px 22px rgba(232,185,77,0.35);}
  .btn-gold:disabled{filter:grayscale(0.6);opacity:0.4;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{background:rgba(255,255,255,0.06);color:var(--white);border:1px solid var(--line);}
  .err{color:#ff8a8a;font-size:13px;margin-top:6px;font-weight:700;}

  .room-code-big{
    text-align:center;font-size:38px;font-weight:900;letter-spacing:10px;color:var(--gold);
    background:rgba(0,0,0,0.28);border:1px dashed var(--gold-dim);border-radius:14px;padding:16px 0;margin-bottom:14px;
  }
  .share-link{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,0.22);border-radius:10px;padding:8px 10px;margin-bottom:16px;}
  .share-link input{border:none;background:transparent;color:var(--muted);font-size:12px;padding:4px;}
  .copy-btn{background:var(--icon1);color:white;border:none;border-radius:8px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap;}

  .players-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .prow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border-radius:12px;padding:10px 12px;}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--panel-hi);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0;}
  .prow .name{font-weight:800;flex:1;}
  .host-badge{font-size:10px;background:var(--gold);color:#241c00;padding:2px 7px;border-radius:20px;font-weight:900;}
  .waiting-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;box-shadow:0 0 8px #4caf50;}

  /* ticker */
  .ticker{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;margin-bottom:4px;}
  .ticker::-webkit-scrollbar{height:4px;}
  .tchip{flex-shrink:0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:130px;}
  .tchip.leading{border-color:var(--gold);background:rgba(232,185,77,0.10);box-shadow:0 0 0 1px rgba(232,185,77,0.25);}
  .tchip .tav{width:26px;height:26px;border-radius:50%;background:var(--panel-hi);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;}
  .tchip .tinfo{display:flex;flex-direction:column;}
  .tchip .tn{font-size:11.5px;font-weight:800;color:var(--white);}
  .tchip .tb{font-size:13.5px;font-weight:900;color:var(--gold);}
  .tchip .tc{font-size:10px;color:var(--muted);}

  /* AUCTION CARD — FUT style */
  .jumbo{position:relative;border-radius:24px;padding:2px;overflow:hidden;margin-top:6px;}
  .jumbo-inner{position:relative;border-radius:22px;padding:22px 18px 20px;text-align:center;overflow:hidden;background:linear-gradient(180deg, var(--panel-hi), var(--panel));}
  .jumbo-bronze{background:linear-gradient(135deg,#B27A46,#7a4f27,#B27A46);}
  .jumbo-silver{background:linear-gradient(135deg,#E4E9EE,#8b95a1,#E4E9EE);}
  .jumbo-gold{background:linear-gradient(135deg,var(--gold-hi),#8a6a12,var(--gold-hi));}
  .jumbo-icon{background:linear-gradient(135deg,var(--icon1),var(--icon2),var(--icon1));}
  .jumbo-icon .jumbo-inner{background:linear-gradient(180deg, rgba(123,79,224,0.14), var(--panel));}

  .tier-ribbon{position:absolute;top:12px;left:-32px;transform:rotate(-40deg);font-size:10px;font-weight:900;padding:3px 40px;letter-spacing:1px;z-index:3;}
  .tier-ribbon.bronze{background:#B27A46;color:#2b1b0c;}
  .tier-ribbon.silver{background:#DEE3E8;color:#20242a;}
  .tier-ribbon.gold{background:linear-gradient(90deg,var(--gold-hi),var(--gold));color:#241c00;}
  .tier-ribbon.icon{background:linear-gradient(90deg,var(--icon2),var(--icon1));color:white;}

  .shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.16) 50%, transparent 60%);background-size:220% 220%;animation:shineMove 3.2s ease-in-out infinite;}
  @keyframes shineMove{0%{background-position:120% 0;}100%{background-position:-20% 0;}}
  @media (prefers-reduced-motion: reduce){ .shine{animation:none;} }

  .jumbo{transition:transform 0.15s ease-out;transform-style:preserve-3d;}
  .jumbo-inner{position:relative;}

  .ovr-badge{position:absolute;top:14px;right:16px;z-index:4;text-align:center;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4));}
  .ovr-badge .n{font-family:'Anton';font-size:26px;color:var(--gold-hi);letter-spacing:0.5px;}
  .ovr-badge .p{font-size:9.5px;font-weight:900;color:var(--muted);letter-spacing:1px;margin-top:1px;}

  .photo-ring-wrap{width:128px;height:128px;margin:4px auto 8px;position:relative;}
  .photo-ring-wrap svg{position:absolute;inset:0;transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:rgba(255,255,255,0.10);stroke-width:6;}
  .ring-fg{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 0.4s linear, stroke 0.3s;}
  .photo-frame{position:absolute;inset:12px;border-radius:50%;overflow:hidden;background:#0a1f15;border:2px solid rgba(255,255,255,0.15);box-shadow:0 6px 18px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.06);}
  .photo-frame img{width:100%;height:100%;object-fit:cover;object-position:top center;}
  .secs-badge{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--night);border:1px solid var(--gold-dim);color:var(--gold);font-weight:900;font-size:12px;padding:2px 9px;border-radius:20px;}

  .pname{font-size:23px;font-weight:900;margin:6px 0 3px;letter-spacing:0.5px;text-shadow:0 2px 12px rgba(0,0,0,0.3);}
  .pmeta{color:var(--muted);font-size:12.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;}
  .badge-icon{width:16px;height:16px;object-fit:contain;}
  .pmeta .dot{opacity:0.5;}
  .pos-pill{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 9px;border-radius:20px;color:#0c1a12;}
  .pos-pill.GK{background:linear-gradient(90deg,#ffe27a,#e8b94d);}
  .pos-pill.DF{background:linear-gradient(90deg,#8fd6ff,#4fa8e0);}
  .pos-pill.MF{background:linear-gradient(90deg,#9df0c4,#3fd18a);}
  .pos-pill.FW{background:linear-gradient(90deg,#ffb0b0,#e14b5e);color:#2a0a0c;}

  .price-row{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-bottom:4px;}
  .price-row .euro{font-size:15px;color:var(--gold);font-weight:800;}
  .price-row .amount{font-family:'Anton';font-size:42px;font-weight:400;color:var(--gold);letter-spacing:1px;text-shadow:0 0 18px rgba(232,185,77,0.35);}
  .leader{font-size:13.5px;font-weight:800;margin-bottom:16px;min-height:20px;}
  .leader .lname{color:var(--white);}
  .leader.none{color:var(--muted);font-weight:600;}

  .bid-actions{display:flex;gap:10px;position:relative;z-index:2;}
  .bid-actions .btn{flex:1;}
  .reason{text-align:center;color:#ff9d9d;font-size:12px;font-weight:700;margin-top:8px;min-height:16px;}

  .squad-summary{margin-top:16px;}
  .squad-summary-head{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13.5px;color:var(--muted);padding:6px 2px 10px;}
  .squad-summary-head b{color:var(--white);}

  .pitch{position:relative;border-radius:16px;padding:14px 10px 10px;overflow:hidden;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0 26px, transparent 26px 52px),
      linear-gradient(180deg,#0f4326,#0a2c19 60%, #0a2213);
    border:1px solid rgba(255,255,255,0.14);}
  .pitch::before{content:'';position:absolute;left:6%;right:6%;top:50%;height:1px;background:rgba(255,255,255,0.22);}
  .pitch::after{content:'';position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border:1px solid rgba(255,255,255,0.22);border-radius:50%;}
  .pitch-row{position:relative;z-index:1;display:flex;justify-content:space-evenly;align-items:flex-start;margin:9px 0;}
  .slot{width:50px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .slot-photo{width:38px;height:38px;border-radius:50%;overflow:hidden;background:#0a1f15;border:2px solid var(--gold);box-shadow:0 3px 10px rgba(0,0,0,0.4);}
  .slot-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;}
  .slot-empty{width:38px;height:38px;border-radius:50%;border:2px dashed rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.3);font-weight:900;font-size:16px;}
  .slot-name{font-size:9px;font-weight:800;color:var(--white);text-align:center;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,0.6);}

  .bench-wrap{margin-top:10px;}
  .bench-title{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px;}
  .bench-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .bench-chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:48px;}
  .bench-chip .bc-photo{width:34px;height:34px;border-radius:50%;overflow:hidden;background:#0a1f15;border:1px solid var(--line);}
  .bench-chip .bc-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;}
  .bench-chip .bc-name{font-size:8.5px;font-weight:700;color:var(--muted);text-align:center;max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bench-empty{color:var(--muted);font-size:11.5px;padding:6px 2px;}

  .role-modal-backdrop{position:fixed;inset:0;background:rgba(3,8,5,0.72);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0 12px 18px;}
  .role-modal{width:100%;max-width:420px;background:linear-gradient(180deg, var(--panel-hi), var(--panel));border:1px solid var(--gold-dim);border-radius:18px;padding:18px;box-shadow:0 -10px 40px rgba(0,0,0,0.5);text-align:center;}
  .role-modal .rm-photo{width:66px;height:66px;border-radius:50%;overflow:hidden;margin:0 auto 8px;border:2px solid var(--gold);}
  .role-modal .rm-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;}
  .role-modal .rm-name{font-weight:900;font-size:17px;margin-bottom:2px;}
  .role-modal .rm-sub{color:var(--muted);font-size:12px;margin-bottom:14px;}
  .role-modal .rm-actions{display:flex;gap:10px;}
  .role-modal .rm-actions .btn{flex:1;}

  .log{margin-top:14px;display:flex;flex-direction:column;gap:5px;max-height:110px;overflow-y:auto;}
  .log-item{font-size:12px;color:var(--muted);background:rgba(0,0,0,0.18);border-radius:8px;padding:6px 10px;}
  .log-item b{color:var(--gold);}

  .center-msg{text-align:center;padding:40px 10px;color:var(--muted);font-weight:700;}
  .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* results */
  .winner-banner{position:relative;overflow:hidden;background:linear-gradient(135deg, rgba(232,185,77,0.18), rgba(232,185,77,0.02));border:1px solid var(--gold-dim);border-radius:18px;padding:20px;margin-bottom:16px;text-align:center;}
  .winner-banner .crown{font-size:30px;}
  .winner-banner h3{margin:6px 0 8px;font-size:19px;font-weight:900;color:var(--gold);}
  .winner-banner p{margin:0;color:var(--white);font-size:13.5px;line-height:1.7;opacity:0.9;}

  .rank-card{background:rgba(255,255,255,0.03);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;}
  .rank-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .rank-medal{font-size:22px;width:34px;text-align:center;}
  .rank-head .rn{font-weight:900;font-size:16px;flex:1;}
  .rank-head .rs{font-size:13px;font-weight:800;color:var(--gold);}
  .rank-verdict{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:10px;}
  .squad-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .pchip{display:flex;align-items:center;gap:6px;font-size:11px;background:rgba(255,255,255,0.06);border-radius:20px;padding:3px 10px 3px 3px;font-weight:700;}
  .pchip img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:#0a1f15;}
  .pchip .p{color:var(--gold);font-weight:900;margin-right:4px;}

  .footer-note{text-align:center;color:#4d6657;font-size:11px;margin-top:22px;line-height:1.7;}

  /* ===== SOCIAL LAYER: mic + chat ===== */
  .fab-stack{position:fixed;left:16px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:60;}
  .fab{position:relative;width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
    font-size:21px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg, var(--panel-hi), var(--panel));border:1px solid var(--line);
    color:var(--white);box-shadow:0 8px 22px rgba(0,0,0,0.45);transition:transform .12s ease, filter .12s ease;}
  .fab:active{transform:scale(0.94);}
  .fab-mic.on{background:linear-gradient(180deg,#3fd18a,#1f9b5e);border-color:#1f9b5e;
    box-shadow:0 0 0 4px rgba(63,209,138,0.18), 0 8px 22px rgba(0,0,0,0.45);animation:micPulse 1.8s ease-in-out infinite;}
  .fab-mic.busy{opacity:0.6;}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 4px rgba(63,209,138,0.18), 0 8px 22px rgba(0,0,0,0.45);}50%{box-shadow:0 0 0 8px rgba(63,209,138,0.1), 0 8px 22px rgba(0,0,0,0.45);}}
  @media (prefers-reduced-motion: reduce){ .fab-mic.on{animation:none;} }
  .fab-badge{position:absolute;top:-4px;right:-4px;background:var(--crimson);color:white;font-size:10px;
    font-weight:900;border-radius:20px;min-width:18px;height:18px;padding:0 4px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px var(--night);}
  .mic-peers{position:fixed;left:16px;bottom:78px;z-index:59;display:flex;flex-direction:column;gap:4px;align-items:flex-start;
    max-width:150px;pointer-events:none;}
  .mic-peer-chip{pointer-events:none;font-size:10.5px;font-weight:800;background:rgba(63,209,138,0.16);color:#9df0c4;
    border:1px solid rgba(63,209,138,0.4);border-radius:20px;padding:3px 9px 3px 6px;display:flex;align-items:center;gap:5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .chat-panel{position:fixed;right:12px;left:12px;bottom:0;max-width:420px;margin:0 auto;
    background:linear-gradient(180deg, var(--panel-hi), var(--panel));border:1px solid var(--line);
    border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,0.5);z-index:61;
    display:flex;flex-direction:column;height:0;overflow:hidden;opacity:0;pointer-events:none;
    transition:height .22s ease, opacity .18s ease;}
  .chat-panel.open{height:min(58vh, 440px);opacity:1;pointer-events:auto;}
  .chat-handle{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:36px;height:4px;
    border-radius:3px;background:rgba(255,255,255,0.18);}
  .chat-head{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px 14px 12px;
    font-weight:900;font-size:14px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .chat-close{background:rgba(255,255,255,0.08);border:none;color:var(--white);width:26px;height:26px;
    border-radius:50%;cursor:pointer;font-size:13px;}
  .chat-messages{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:7px;}
  .chat-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:20px 0;}
  .chat-msg{max-width:82%;background:rgba(255,255,255,0.05);border-radius:12px;padding:6px 10px;font-size:13px;align-self:flex-start;}
  .chat-msg.me{align-self:flex-end;background:rgba(232,185,77,0.16);border:1px solid rgba(232,185,77,0.25);}
  .chat-msg .cm-name{display:block;font-size:10.5px;font-weight:900;color:var(--gold);margin-bottom:2px;}
  .chat-msg.me .cm-name{color:var(--gold-hi);}

/* ============ ATOMIC ROOM UPDATES (anti-corruption / anti-race) ============
   كل الأكشنز الحساسة (المزايدة، بدء المزاد، تحديد الدكة/الأساسي، قفل الكارت)
   بتعدي من هنا: بنقرا أحدث نسخة من الغرفة، ونكتب بس لو حد تاني ما كتبش فوقها
   من ساعة ما قرينا (compare-and-swap على updated_at). لو حصل تعارض (اتنين
   ضغطوا في نفس اللحظة، أو حصل ريفريش/قطع نت وسط العملية) بنعيد المحاولة

   الضغط أو فتح أكتر من تاب لنفس اللاعب. */
async function withRoomLock(code, mutator, maxRetries=8){
  for(let attempt=0; attempt<maxRetries; attempt++){
    let row;
    try{
      const {data, error} = await sb.from('rooms').select('state, updated_at').eq('code', code).maybeSingle();
      if(error || !data) return {ok:false, state:null};
      row = data;
    }catch(e){ return {ok:false, state:null}; }

    const state = row.state;
    let mutRes;
    try{ mutRes = await mutator(state); }
    catch(e){ console.error('mutator failed', e); return {ok:false, state}; }
    if(mutRes && mutRes.abort) return {ok:false, state, reason:mutRes.reason};

    const nowIso = new Date().toISOString();
    try{
      const {data:updated, error:updErr} = await sb.from('rooms')
        .update({state, updated_at: nowIso})
        .eq('code', code).eq('updated_at', row.updated_at)
        .select('code');
      if(updErr){ console.error('cas update failed', updErr); return {ok:false, state}; }
      if(updated && updated.length>0) return {ok:true, state};
    }catch(e){ console.error('cas update threw', e); return {ok:false, state}; }
    // في تعارض (state اتغيرت من حد تاني وسط العملية) — استنى شوية وحاول تاني
    await new Promise(r=>setTimeout(r, 90 + Math.random()*160));
  }
  return {ok:false, state:null, reason:'max-retries'};
}

function normalizePos(raw){
  const s = (raw||'').toLowerCase();
  if(/goalkeeper/.test(s)) return 'GK';
  if(/centre-back|center-back|right-back|left-back|full-back|fullback|wing-back|sweeper|defender/.test(s)) return 'DF';
  if(/midfielder|midfield/.test(s)) return 'MF';
  if(/forward|striker|winger/.test(s)) return 'FW';
  return null;
}
function priceFor(pos){
  const bands = {GK:[8,55], DF:[10,95], MF:[12,190], FW:[15,195]};
  const [mn,mx] = bands[pos] || [10,80];
  const r = Math.pow(Math.random(), 2.2); // skew toward lower values, few superstars
  return Math.max(mn, Math.round(mn + r*(mx-mn)));
}
function tierFor(price){
  if(price>=140) return 'icon';
  if(price>=70) return 'gold';
  if(price>=30) return 'silver';
  return 'bronze';
}
function ratingFor(price){
  // maps our 8-195 price scale to a FUT-style 62-99 overall rating
  return Math.max(60, Math.min(99, Math.round(60 + (price/195)*39)));

async function wikiSummary(title){
  try{
    const res = await fetch(WIKI_REST + encodeURIComponent(title.replace(/ /g,'_')));
    if(!res.ok) return null;
    const d = await res.json();
    if(d.type === 'disambiguation') return null;

  }catch(e){ return null; }

async function resolveTitle(query, namespace){
  try{
    const url = `${WIKI_API}?action=query&list=search&srsearch=${encodeURIComponent(query)}&srnamespace=${namespace}&srlimit=1&format=json&origin=*`;
    const res = await fetch(url);
    const data = await res.json();
    const hit = data && data.query && data.query.search && data.query.search[0];
    return hit ? hit.title : null;
  }catch(e){ return null; }
}
async function fetchCategoryMembers(catTitle, limit){
  try{
    const url = `${WIKI_API}?action=query&list=categorymembers&cmtitle=${encodeURIComponent(catTitle)}&cmnamespace=0&cmlimit=${limit}&format=json&origin=*`;
    const res = await fetch(url);
    const data = await res.json();
    const members = (data && data.query && data.query.categorymembers) || [];
    return members.map(m=>m.title).filter(t=>!/^list of/i.test(t));
  }catch(e){ return []; }
}

async function fetchTeamPlayers(team, league){
  const cat = await resolveTitle(team+' players', 14); // 14 = Category namespace
  if(!cat) return [];
  const allMembers = await fetchCategoryMembers(cat, 200);
  if(!allMembers.length) return [];
  const sample = shuffle(allMembers).slice(0, 9);
  const badgeSummary = await wikiSummary(team);
  const badge = (badgeSummary && badgeSummary.thumbnail && badgeSummary.thumbnail.source) || null;
  const results = await Promise.all(sample.map(async title=>{
    const d = await wikiSummary(title);
    if(!d || !d.thumbnail || !d.thumbnail.source) return null;
    const text = ((d.description||'') + ' ' + (d.extract||'')).toLowerCase();
    if(!/footbal/.test(text)) return null;
    const pos = normalizePos(text);
    if(!pos) return null;
    const price = priceFor(pos);
    return {
      id: 'p' + (d.pageid || title) + '_' + Math.random().toString(36).slice(2,7),
      name: d.title, pos, price, tier: tierFor(price), rating: ratingFor(price),
      club: team, league, img: d.thumbnail.source, badge,
    };
  }));
  return results.filter(Boolean);
}
async function fetchByName(name){

  const text = ((d.description||'') + ' ' + (d.extract||'')).toLowerCase();
  const pos = normalizePos(text) || 'FW';
  const price = priceFor(pos);
  return {
    id:'p'+name.replace(/\s+/g,'')+'_'+Math.random().toString(36).slice(2,7),
    name: d.title, pos, price, tier: tierFor(price), rating: ratingFor(price),
    club: d.description||'', league: '', img: d.thumbnail.source, badge: null,
  };
}

async function buildPlayerPool(onProgress){
  const shuffledClubs = shuffle(CLUB_QUERY);
  let pool = [];
  let done = 0;
  const BATCH = 6; // fetch a handful of clubs at a time so we don't hammer Wikipedia at once
  for(let i=0;i<shuffledClubs.length;i+=BATCH){
    const batch = shuffledClubs.slice(i, i+BATCH);
    const batchResults = await Promise.all(batch.map(c=>fetchTeamPlayers(c.team, c.league)));
    batchResults.forEach(players=>{ pool = pool.concat(players); });
    done += batch.length;
    if(onProgress) onProgress(Math.min(done, shuffledClubs.length), shuffledClubs.length);
  }
  // de-duplicate by name
  const seen = new Set();
  pool = pool.filter(p=>{ if(seen.has(p.name)) return false; seen.add(p.name); return true; });

  if(pool.length < 50){
    const extra = await Promise.all(shuffle(ICONIC_FALLBACK_NAMES).map(fetchByName));
    extra.filter(Boolean).forEach(p=>{ if(!seen.has(p.name)){ seen.add(p.name); pool.push(p); } });
  }
  return pool;
}

const ICE_SERVERS = [{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];

const pendingAudioEls = new Set();
function tryPlayAudio(el){
  const p = el.play();
  if(p && typeof p.catch==='function'){
    p.then(()=>{ pendingAudioEls.delete(el); })
     .catch(()=>{ pendingAudioEls.add(el); });
  }
}
function unlockPendingAudio(){
  if(!pendingAudioEls.size) return;
  pendingAudioEls.forEach(el=>{ if(document.body.contains(el)) tryPlayAudio(el); else pendingAudioEls.delete(el); });
}
['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev, unlockPendingAudio, {passive:true}));

function attachRemoteAudio(peerName, stream){
  const box = document.getElementById('remoteAudios');
  if(!box) return;
  let el = document.getElementById('audio-'+cssSafe(peerName));
  if(!el){
    el = document.createElement('audio');
    el.id = 'audio-'+cssSafe(peerName);
    el.autoplay = true; el.playsInline = true; el.muted = false; el.volume = 1;
    box.appendChild(el);
  }
  if(el.srcObject !== stream){
    el.srcObject = stream;
    tryPlayAudio(el);
  }
}

function ensurePeerConnection(peerName){
  if(peerConnections[peerName]) return peerConnections[peerName];
  const polite = myName > peerName; // ترتيب ثابت بالاسم يحدد مين "المهذب" وقت تعارض عرضين في نفس اللحظة
  const pc = new RTCPeerConnection({iceServers: ICE_SERVERS});
  peerConnections[peerName] = pc;
  peerMeta[peerName] = {polite, makingOffer:false, ignoreOffer:false};

  if(localStream){ pc.addTrack(localStream.getAudioTracks()[0], localStream); }
  else { pc.addTransceiver('audio', {direction:'recvonly'}); }

  pc.onicecandidate = (e)=>{ if(e.candidate) sendSignal(peerName, {type:'ice', candidate:e.candidate.toJSON()}); };
  pc.ontrack = (e)=>{ attachRemoteAudio(peerName, e.streams[0]); };
  pc.onnegotiationneeded = async ()=>{
    const meta = peerMeta[peerName];
    if(!meta) return;
    try{
      meta.makingOffer = true;
      const offer = await pc.createOffer();
      if(pc.signalingState!=='stable') return;
      await pc.setLocalDescription(offer);
      sendSignal(peerName, {type:'offer', description: pc.localDescription});
    }catch(e){ console.error('negotiation failed', e); }
    finally{ meta.makingOffer = false; }
  };
  return pc;
}

async function handleSignal(from, data){
  if(!data || !from) return;
  const pc = ensurePeerConnection(from);
  const meta = peerMeta[from];
  try{
    if(data.type==='offer'){
      const offerCollision = meta.makingOffer || pc.signalingState!=='stable';
      meta.ignoreOffer = !meta.polite && offerCollision;
      if(meta.ignoreOffer) return; // إحنا "المش-مهذبين" وبنكسب التعارض، بنتجاهل عرضه ونستنى بتاعنا
      await pc.setRemoteDescription(new RTCSessionDescription(data.description));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      sendSignal(from, {type:'answer', description: pc.localDescription});
    } else if(data.type==='answer'){
      if(pc.signalingState==='have-local-offer') await pc.setRemoteDescription(new RTCSessionDescription(data.description));
    } else if(data.type==='ice'){
      try{ await pc.addIceCandidate(data.candidate); }
      catch(e){ if(!meta.ignoreOffer) console.error('ice add failed', e); }
    }
  }catch(e){ console.error('signal handling error', e); }
}

function removePeer(peerName){
  const pc = peerConnections[peerName];
  if(pc){ try{ pc.close(); }catch(e){} delete peerConnections[peerName]; }
  delete peerMeta[peerName];
  delete presenceMicMap[peerName];
  const el = document.getElementById('audio-'+cssSafe(peerName));
  if(el) el.remove();
}
function cleanupAllPeers(){ Object.keys(peerConnections).forEach(removePeer); }

function onPresenceSync(){
  if(!realtimeChannel) return;
  const state = realtimeChannel.presenceState();
  const now = new Set();
  const nextMicMap = {};
  Object.entries(state).forEach(([key, metas])=>{
    if(key===myName) return;
    now.add(key);
    nextMicMap[key] = !!((metas && metas[0]) || {}).micOn;
  });
  presenceMicMap = nextMicMap;
  Object.keys(peerConnections).forEach(p=>{ if(!now.has(p)) removePeer(p); });
  now.forEach(p=>{ if(!peerConnections[p]) ensurePeerConnection(p); });
  renderSocialLayer();
}

function onChatMessage(payload){
  if(!payload || !payload.text) return;
  chatMessages.push(payload);
  if(chatMessages.length>60) chatMessages = chatMessages.slice(-60);
  if(!chatOpen) chatUnread++;
  renderSocialLayer();
}

function sendChat(text){
  text = (text||'').trim();
  if(!text || !realtimeChannel) return;
  const payload = {name: myName, text: text.slice(0,300), ts: Date.now()};
  chatMessages.push(payload);
  if(chatMessages.length>60) chatMessages = chatMessages.slice(-60);
  realtimeChannel.send({type:'broadcast', event:'chat', payload});
  renderSocialLayer();
}

async function toggleMic(){
  if(micBusy) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert('المتصفح ده مش بيدعم المايك. جرب متصفح تاني أو حدّث المتصفح الحالي.');
    return;
  }
  micBusy = true; renderSocialLayer();
  try{
    if(!localStream){
      localStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
      micOn = true;
      const track = localStream.getAudioTracks()[0];
      track.enabled = true;
      Object.values(peerConnections).forEach(pc=>{
        const tr = pc.getTransceivers().find(t=>t.receiver && t.receiver.track && t.receiver.track.kind==='audio' && (!t.sender || !t.sender.track));
        if(tr){ tr.sender.replaceTrack(track); if(tr.direction!=='sendrecv') tr.direction='sendrecv'; }
        else { pc.addTrack(track, localStream); }
      });
      // نحاول نشغّل أي صوت وصل قبل كده ومنعه المتصفح، دلوقتي إن المستخدم دَاس على زرار (لمسة/كليك)
      unlockPendingAudio();
    } else {
      micOn = !micOn;
      localStream.getAudioTracks().forEach(t=>{ t.enabled = micOn; });
    }
    if(realtimeChannel) realtimeChannel.track({name:myName, micOn, ts:Date.now()});
  }catch(e){
    console.error('mic error', e);
    let msg = 'مقدرناش نوصل للمايك. تأكد إنك سامح للموقع بصلاحية استخدام المايكروفون من إعدادات المتصفح.';
    if(e && e.name==='NotFoundError') msg = 'مفيش مايك متوصل بالجهاز ده. وصّل مايك أو استخدم جهاز فيه مايك.';
    else if(e && e.name==='NotAllowedError') msg = 'المايك متمنوع. من إعدادات المتصفح، سمح للموقع بصلاحية المايكروفون وجرب تاني.';
    else if(e && e.name==='NotReadableError') msg = 'مايك الجهاز مستخدم في تطبيق تاني دلوقتي. قفل أي تطبيق تاني بيستخدم المايك وجرب تاني.';
    alert(msg);
  }
  micBusy = false; renderSocialLayer();
}

function pushLog(state, text){
  state.log = state.log || [];
  state.log.unshift(text);
  state.log = state.log.slice(0,8);
}

async function createRoom(name){
  creating = true; render();
  let code, existing;
  for(let i=0;i<5;i++){
    code = genCode();
    existing = await getRoom(code);
    if(!existing) break;
  }
  const state = {
    code, phase:'lobby', playersOrder:[name],
    players:{ [name]: {budget:START_BUDGET, squad:[], host:true} },
    pool:[], cardQueue:null, cardIndex:-1, currentCard:null, currentBid:0, currentBidder:null,
    auctionEndsAt:null, settleLock:null, log:[], results:null, resultsStatus:null,
  };
  await setRoom(code, state);
  myName = name; roomCode = code; localState = state; creating=false;
  history.replaceState(null,'', location.pathname+'?room='+code);
  startPolling();
  render();
}

async function joinRoom(code, name){
  joinError=""; render();
  const first = await getRoom(code);
  if(!first){ joinError="مفيش غرفة بالكود ده."; render(); return; }

  let finalState = first;
  if(!first.players[name]){
    const res = await withRoomLock(code, (state)=>{
      if(state.players[name]) return; // حد تاني دخل بنفس الاسم فعلاً، مفيش داعي نضيفه تاني
      if(state.phase!=='lobby') return {abort:true, reason:'started'};
      if(state.playersOrder.length>=4) return {abort:true, reason:'full'};
      state.players[name] = {budget:START_BUDGET, squad:[], host:false};
      state.playersOrder.push(name);
      pushLog(state, `<b>${name}</b> دخل الغرفة`);
    });
    if(!res.ok){
      if(res.reason==='started'){ joinError="المزاد بدأ بالفعل، مينفعش تنضم دلوقتي."; render(); return; }
      if(res.reason==='full'){ joinError="الغرفة مكتملة (4 لاعبين)."; render(); return; }
      joinError="حصلت مشكلة في الاتصال، جرب تاني."; render(); return;
    }
    finalState = res.state;
  }
  myName = name; roomCode = code; localState = finalState;
  history.replaceState(null,'', location.pathname+'?room='+code);
  startPolling();
  render();
}

async function startAuction(){
  startingAuction = true; startProgressText = "بنجيب نجوم الموسم من كل الأندية..."; render();
  const pool = await buildPlayerPool((done,total)=>{
    startProgressText = `بنجهز اللاعبين... (${done}/${total} فريق)`;
    render();
  });
  if(pool.length < 12){
    startingAuction = false;
    joinError = "";
    bidError = "";
    alert("تعذر تحميل اللاعبين من مصدر الصور، جرب تاني كمان شوية.");
    render();
    return;
  }
  const shuffledPool = shuffle(pool);
  const res = await withRoomLock(roomCode, (state)=>{
    if(state.phase!=='lobby') return {abort:true}; // حد تاني (المدير من تاب تاني مثلاً) بدأ المزاد فعلاً
    if(state.playersOrder.length<2) return {abort:true};
    state.pool = shuffledPool;
    state.cardQueue = shuffledPool.map((_,i)=>i).slice(0, Math.min(shuffledPool.length, MAX_CARDS));
    state.cardIndex = 0;
    state.currentCard = shuffledPool[state.cardQueue[0]];
    state.currentBid = state.currentCard.price;
    state.currentBidder = null;
    state.auctionEndsAt = Date.now() + BID_SECONDS*1000;
    state.phase = 'auction';
    pushLog(state, `بدأ المزاد! أول كارت: <b>${state.currentCard.name}</b>`);
  });
  if(res.ok) localState = res.state;
  startingAuction=false; render();
}

let bidding = false;
async function placeBid(mult){
  if(bidding) return; // يمنع الضغط المزدوج/المتكرر السريع (double-tap) من إرسال مزايدتين
  bidding = true;
  bidError="";
  let localErr = "";
  const res = await withRoomLock(roomCode, (state)=>{
    localErr = "";
    if(state.phase!=='auction') return {abort:true};
    if(Date.now() >= state.auctionEndsAt) return {abort:true}; // الوقت خلص فعلاً، سيب settleTick يقفل الكارت
    const me = state.players[myName];
    if(!me) return {abort:true};
    const card = state.currentCard;
    const inc = incrementFor(state.currentBid) * mult;
    const newBid = state.currentBid + inc;
    const posCount = me.squad.filter(s=>s.pos===card.pos).length;

    if(me.squad.length >= SQUAD_MAX_TOTAL){ localErr="تشكيلتك مكتملة (18 لاعب)."; return {abort:true}; }
    if(posCount >= POS_MAX[card.pos]){ localErr=`وصلت للحد الأقصى من ${POS_LABEL[card.pos]}ين.`; return {abort:true}; }
    const hypotheticalSquad = [...me.squad, {pos:card.pos}];
    if(me.budget - newBid < reserveNeeded(hypotheticalSquad)){ localErr="لازم تسيب فلوس كفاية تكمل بيها التشكيلة."; return {abort:true}; }
    if(state.currentBidder === myName){ localErr="إنت صاحب أعلى مزايدة بالفعل."; return {abort:true}; }

    state.currentBid = newBid;
    state.currentBidder = myName;
    // الوقت مبيرجعش م الأول لما حد يزايد — بيفضل عادّ عادي عشان لاعب يقدر يخطف الكارت في آخر ثانية
  });
  if(res.ok) localState = res.state;
  else if(res.state) localState = res.state;
  bidError = localErr;
  bidding = false;
  render();
}

function allFull(players){
  return Object.values(players).every(p=>p.squad.length >= SQUAD_MAX_TOTAL);
}

let roleAssigning = false;
async function assignRole(playerId, role){
  if(roleAssigning) return;
  roleAssigning = true;
  const res = await withRoomLock(roomCode, (state)=>{
    const me = state.players[myName];
    if(!me) return {abort:true};
    const entry = me.squad.find(x=>x.id===playerId && x.role===null);
    if(!entry) return {abort:true};
    let r = role;
    if(r==='start'){
      const startersInPos = me.squad.filter(x=>x.role==='start' && x.pos===entry.pos).length;
      if(startersInPos >= STARTER_MAX[entry.pos]) r = 'bench'; // خانات المركز مكتملة، ينزل الدكة تلقائيًا
    }
    entry.role = r;
    pushLog(state, `<b>${myName}</b> نزّل ${entry.name} ${r==='start'? 'أساسي':'على الدكة'}`);
  });
  if(res.ok) localState = res.state;
  roleAssigning = false;
  render();
}

let settlingInFlight = false;
async function settleTick(){
  if(!localState || localState.phase!=='auction') return;
  if(Date.now() < localState.auctionEndsAt) return;
  if(settlingInFlight) return; // منع نفس التاب من يبدأ محاولة تسوية جوه محاولة تانية شغالة
  settlingInFlight = true;

  const lockId = Math.random().toString(36).slice(2);
  // خطوة القفل نفسها بقت atomic (CAS) — لو تابين حاولوا يقفلوا الكارت في نفس اللحظة،
  // واحد بس هيكسب القفل والتاني هياخد conflict ويرجع يقرا الحالة الجديدة تلقائيًا.
  const claim = await withRoomLock(roomCode, (state)=>{
    if(state.phase!=='auction') return {abort:true};
    if(Date.now() < state.auctionEndsAt) return {abort:true};
    state.phase = 'settling';
    state.settleLock = {id:lockId, at:Date.now()};
  });
  if(!claim.ok){ if(claim.state) localState = claim.state; settlingInFlight=false; render(); return; }

  let state = claim.state; // إحنا اللي كسبنا القفل فعليًا، مفيش حد تاني هيلمس الكارت ده دلوقتي
  const card = state.currentCard;
  if(state.currentBidder){
    const buyer = state.players[state.currentBidder];
    buyer.budget -= state.currentBid;
    buyer.squad.push({id:card.id, name:card.name, pos:card.pos, club:card.club, league:card.league, price:state.currentBid, img:card.img, role:null});
    pushLog(state, `<b>${state.currentBidder}</b> اشترى ${card.name} بـ €${state.currentBid}م`);
  } else {
    pushLog(state, `${card.name} خرج من المزاد من غير ما حد يشتريه`);
  }

  const nextIndex = state.cardIndex + 1;
  const full = allFull(state.players);
  if(nextIndex >= state.cardQueue.length || full){
    Object.values(state.players).forEach(p=>{
      p.squad.forEach(x=>{
        if(x.role===null){
          const startersInPos = p.squad.filter(y=>y.role==='start' && y.pos===x.pos).length;
          x.role = startersInPos < STARTER_MAX[x.pos] ? 'start' : 'bench';
        }
      });
    });
    state.phase = 'results';
    state.currentCard = null;
    state.currentBidder = null;
    state.settleLock = null;
    state.resultsStatus = 'pending';
    await setRoom(roomCode, state);
    localState = state; settlingInFlight=false; render();
    runAIRanking(state);
    return;
  }

  state.cardIndex = nextIndex;
  state.currentCard = state.pool[state.cardQueue[nextIndex]];
  state.currentBid = state.currentCard.price;
  state.currentBidder = null;
  state.auctionEndsAt = Date.now() + BID_SECONDS*1000;
  state.settleLock = null;
  state.phase = 'auction';
  await setRoom(roomCode, state);
  localState = state; settlingInFlight=false; render();
}

async function runAIRanking(state){
  try{
    const squadsSummary = state.playersOrder.map(name=>{
      const p = state.players[name];
      return {
        managerName: name,
        remainingBudget: p.budget,
        totalPlayers: p.squad.length,
        squad: p.squad.map(s=>({name:s.name, position:POS_LABEL[s.pos], club:s.club, pricePaid:s.price}))
      };
    });
    const prompt = `انت خبير تحليل كرة قدم. تحت تشكيلات ${state.playersOrder.length} مديرين اشتروها في مزاد لاعبين حقيقيين (كل واحد كان معاه 10 مليار يورو). قيّم كل تشكيلة من ناحية: جودة اللاعبين، التوازن بين الخطوط (حراسة/دفاع/وسط/هجوم)، الكيمياء المحتملة، والقيمة مقابل المصاريف. رتبهم من الأفضل للأضعف.

البيانات:
${JSON.stringify(squadsSummary, null, 2)}

رد فقط بصيغة JSON صحيحة بدون أي نص إضافي أو Markdown، بالشكل ده بالظبط:
{"ranking":[{"managerName":"...","place":1,"score":87,"verdict":"تحليل من جملتين او تلاتة بالعربي عن نقاط القوة والضعف"}],"overall":"فقرة قصيرة بالعربي تشرح ليه صاحب المركز الأول فاز وتقارن بسرعة بين الفرق"}`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        messages: [{role:"user", content: prompt}]
      })
    });
    const data = await response.json();
    let text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    text = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(text);

    const fresh = await getRoom(roomCode);
    if(fresh && fresh.phase==='results'){
      fresh.results = parsed;
      fresh.resultsStatus = 'done';
      await setRoom(roomCode, fresh);
      localState = fresh; render();
    }
  }catch(e){
    console.error('AI ranking failed', e);
    const fallback = {
      ranking: state.playersOrder.map(name=>{
        const p = state.players[name];
        const totalSpent = p.squad.reduce((s,x)=>s+x.price,0);
        const balance = ["GK","DF","MF","FW"].every(pos=>p.squad.filter(s=>s.pos===pos).length >= (POS_MIN[pos]-2));
        const score = Math.round(totalSpent/4 + (balance?15:0));
        return {managerName:name, place:0, score, verdict:"تعذر الوصول لنظام التحليل، ده تقييم مبسط بناءً على قيمة التشكيلة."};
      }).sort((a,b)=>b.score-a.score).map((r,i)=>({...r, place:i+1})),
      overall: "تعذر الاتصال بخدمة التحليل، فالترتيب ده مبني على إجمالي قيمة اللاعبين اللي اشتراهم كل مدير."
    };
    const fresh = await getRoom(roomCode);
    if(fresh && fresh.phase==='results'){
      fresh.results = fallback;
      fresh.resultsStatus = 'done';
      await setRoom(roomCode, fresh);
      localState = fresh; render();
    }
  }
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  if(tickTimer) clearInterval(tickTimer);
  subscribeRoom(roomCode);
  pollTimer = setInterval(async ()=>{
    if(!roomCode) return;
    const s = await getRoom(roomCode);
    if(s){ localState = s; render(); }
  }, 4000);
  tickTimer = setInterval(()=>{
    settleTick();
    if(localState && localState.phase==='auction') renderTimerOnly();
  }, 500);
}

/* ============ RENDER ============ */
const app = document.getElementById('app');
const footerNote = document.getElementById('footerNote');

function esc(s){ return (s||'').replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function imgAttrs(src){ return `src="${esc(src||PLACEHOLDER_IMG)}" onerror="this.onerror=null;this.src='${PLACEHOLDER_IMG}';"`; }

function render(){
  footerNote.textContent = roomCode ? `غرفة رقم ${roomCode} — صور اللاعبين وأسعارهم بتتحدد عشوائيًا وقت المزاد` : '2 إلى 4 لاعبين، 10 مليار يورو لكل واحد، وتشكيلة من 15 إلى 18 لاعب — بصور حقيقية عشوائية في كل مباراة';

  if(!roomCode){ renderLanding(); return; }
  if(!localState){ app.innerHTML = `<div class="card"><div class="center-msg"><div class="spinner"></div>بنجهز الغرفة...</div></div>`; return; }

  if(localState.phase==='lobby') renderLobby();
  else if(localState.phase==='auction' || localState.phase==='settling') renderAuction();
  else if(localState.phase==='results') renderResults();
}

let landingTab = urlRoom ? 'join' : 'create';

function renderLanding(){
  app.innerHTML = `
    <div class="card">
      <div class="tabs">
        <div class="tab ${landingTab==='create'?'active':''}" id="tabCreate">إنشاء غرفة</div>
        <div class="tab ${landingTab==='join'?'active':''}" id="tabJoin">الانضمام لغرفة</div>
      </div>
      <div id="formArea"></div>
    </div>
  `;
  document.getElementById('tabCreate').onclick = ()=>{landingTab='create'; render();};
  document.getElementById('tabJoin').onclick = ()=>{landingTab='join'; render();};
  const formArea = document.getElementById('formArea');

  if(landingTab==='create'){
    formArea.innerHTML = `
      <h2>ابدأ مزاد جديد</h2>
      <p class="sub">هتبقى إنت المدير الأول، وبعدين ابعت اللينك لأصحابك (2-4 لاعبين) عشان ينضموا من جهازهم.</p>
      <div class="field"><label>اسمك</label><input type="text" id="cName" placeholder="اكتب اسمك" maxlength="16"></div>
      <button class="btn btn-gold" id="cBtn" ${creating?'disabled':''}>${creating? 'بنجهز...' : 'إنشاء الغرفة'}</button>
    `;
    document.getElementById('cBtn').onclick = ()=>{
      const v = document.getElementById('cName').value.trim();
      if(!v) return;
      createRoom(v);
    };
  } else {
    formArea.innerHTML = `
      <h2>انضم لغرفة</h2>
      <p class="sub">اكتب كود الغرفة اللي جالك من صاحبك واسمك عشان تدخل.</p>
      <div class="field"><label>كود الغرفة</label><input type="text" id="jCode" placeholder="مثال: 4821" maxlength="4" value="${urlRoom||''}"></div>
      <div class="field"><label>اسمك</label><input type="text" id="jName" placeholder="اكتب اسمك" maxlength="16"></div>
      <button class="btn btn-gold" id="jBtn">دخول الغرفة</button>
      ${joinError? `<div class="err">${esc(joinError)}</div>` : ''}
    `;
    document.getElementById('jBtn').onclick = ()=>{
      const code = document.getElementById('jCode').value.trim();
      const name = document.getElementById('jName').value.trim();
      if(!code || !name) return;
      joinRoom(code, name);
    };
  }
}

function renderLobby(){
  const s = localState;
  const isHost = s.players[myName] && s.players[myName].host;
  const link = location.origin + location.pathname + '?room=' + s.code;
  if(startingAuction){
    app.innerHTML = `<div class="card"><div class="center-msg"><div class="spinner"></div>${esc(startProgressText)}</div></div>`;
    return;
  }
  app.innerHTML = `
    <div class="card">
      <h2>غرفة الانتظار</h2>
      <p class="sub">شارك الكود أو اللينك مع أصحابك. المزاد يبدأ لما يكونوا 2 لاعبين على الأقل.</p>
      <div class="room-code-big">${s.code}</div>
      <div class="share-link"><input type="text" readonly value="${link}" id="linkInput"><button class="copy-btn" id="copyBtn">نسخ الرابط</button></div>
      <div class="players-list">
        ${s.playersOrder.map(n=>`
          <div class="prow">
            <div class="avatar">${esc(n[0]||'?')}</div>
            <div class="name">${esc(n)} ${n===myName?'(إنت)':''}</div>
            ${s.players[n].host? '<span class="host-badge">المدير الرئيسي</span>':''}
            <div class="waiting-dot"></div>
          </div>`).join('')}
        ${Array.from({length: Math.max(0,2-s.playersOrder.length)}).map(()=>`
          <div class="prow" style="opacity:0.4;">
            <div class="avatar">؟</div><div class="name">في انتظار لاعب...</div>
          </div>`).join('')}
      </div>
      ${isHost ? `
        <button class="btn btn-gold" id="startBtn" ${s.playersOrder.length<2?'disabled':''}>
          ${s.playersOrder.length<2? 'محتاج لاعب واحد على الأقل كمان' : 'ابدأ المزاد 🚀'}
        </button>` : `<div class="center-msg" style="padding:14px;">في انتظار المدير الرئيسي يبدأ المزاد...</div>`}
    </div>
  `;
  document.getElementById('copyBtn').onclick = ()=>{
    navigator.clipboard.writeText(link).then(()=>{
      document.getElementById('copyBtn').textContent = 'اتنسخ!';
      setTimeout(()=>{ const b=document.getElementById('copyBtn'); if(b) b.textContent='نسخ الرابط'; }, 1500);
    });
  };
  if(isHost){ document.getElementById('startBtn').onclick = startAuction; }
}

function timeFrac(){
  if(!localState || !localState.auctionEndsAt) return 0;
  const remain = localState.auctionEndsAt - Date.now();
  return Math.max(0, Math.min(1, remain/(BID_SECONDS*1000)));
}
function renderTimerOnly(){
  const ring = document.getElementById('ringFg');
  const secsEl = document.getElementById('secsLeft');
  if(!ring || !secsEl) return;
  const frac = timeFrac();
  const R = 58, C = 2*Math.PI*R;
  ring.style.strokeDashoffset = C*(1-frac);
  ring.style.stroke = frac < 0.25 ? 'var(--crimson)' : 'var(--gold)';
  const secs = Math.ceil((localState.auctionEndsAt - Date.now())/1000);
  secsEl.textContent = Math.max(0, secs);
}

function renderAuction(){
  const s = localState;
  const me = s.players[myName];
  if(!me){ app.innerHTML = `<div class="card"><div class="center-msg">مش لاقيك في الغرفة دي.</div></div>`; return; }
  const card = s.currentCard;
  const settling = s.phase === 'settling' || !card;
  const R = 58, C = 2*Math.PI*R;
  const frac = timeFrac();
  const tier = card ? card.tier : 'bronze';
  const pending = me.squad.find(x=>x.role===null);

  app.innerHTML = `
    <div class="ticker">
      ${s.playersOrder.map(n=>{
        const p = s.players[n];
        return `<div class="tchip ${s.currentBidder===n?'leading':''}">
          <div class="tav">${esc(n[0]||'?')}</div>
          <div class="tinfo">
            <div class="tn">${esc(n)}${n===myName?' (إنت)':''}</div>
            <div class="tb">€${fmtMoney(p.budget)}</div>
            <div class="tc">${p.squad.length}/${SQUAD_MAX_TOTAL} لاعب</div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <div class="jumbo ${card?('jumbo-'+tier):''}">
      <div class="jumbo-inner">
        ${!settling ? `<div class="shine"></div><div class="tier-ribbon ${tier}">${TIER_LABEL[tier]}</div>
          <div class="ovr-badge"><div class="n">${card.rating||'--'}</div><div class="p">${POS_LABEL[card.pos]}</div></div>` : ''}
        ${settling ? `
          <div class="center-msg"><div class="spinner"></div>بنقفل المزايدة على الكارت ده...</div>
        ` : `
          <div class="photo-ring-wrap">
            <svg width="128" height="128" viewBox="0 0 128 128">
              <circle class="ring-bg" cx="64" cy="64" r="${R}"/>
              <circle class="ring-fg" id="ringFg" cx="64" cy="64" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/>
            </svg>
            <div class="photo-frame"><img ${imgAttrs(card.img)} alt=""></div>
            <div class="secs-badge" id="secsLeft">${Math.max(0,Math.ceil((s.auctionEndsAt-Date.now())/1000))}</div>
          </div>
          <div class="pname display">${esc(card.name)}</div>
          <div class="pmeta">
            <span class="pos-pill ${card.pos}">${POS_LABEL[card.pos]}</span>
            <span class="dot">•</span>
            ${card.badge? `<img class="badge-icon" ${imgAttrs(card.badge)} alt="">` : ''}
            ${esc(card.club)}
            ${card.league? `<span class="dot">•</span>${esc(card.league)}`:''}
          </div>
          <div class="price-row"><span class="euro">€</span><span class="amount">${s.currentBid}</span><span class="euro">مليون</span></div>
          <div class="leader ${s.currentBidder?'':'none'}">${s.currentBidder? `أعلى مزايدة: <span class="lname">${esc(s.currentBidder)}${s.currentBidder===myName?' (إنت)':''}</span>` : 'مفيش حد زايد لسه — كن أول واحد'}</div>
          <div class="bid-actions">
            <button class="btn btn-gold" id="bid1">زايد بـ €${incrementFor(s.currentBid)}م</button>
            <button class="btn btn-ghost" id="bid3">زود €${incrementFor(s.currentBid)*3}م</button>
          </div>
          <div class="reason">${bidError? esc(bidError) : ''}</div>
        `}
      </div>
    </div>

    <div class="squad-summary">
      <div class="squad-summary-head"><span>تشكيلتك (<b>${me.squad.length}/${SQUAD_MAX_TOTAL}</b>)</span><span>€${fmtMoney(me.budget)} متبقي</span></div>
      ${renderPitchHTML(me.squad)}
    </div>

    <div class="log">
      ${(s.log||[]).map(l=>`<div class="log-item">${l}</div>`).join('')}
    </div>

    ${pending ? `
    <div class="role-modal-backdrop" id="roleBackdrop">
      <div class="role-modal">
        <div class="rm-photo"><img ${imgAttrs(pending.img)} alt=""></div>
        <div class="rm-name">${esc(pending.name)}</div>
        <div class="rm-sub">اشتريته دلوقتي — هينزل ${POS_LABEL[pending.pos]}. تحطه فين؟</div>
        <div class="rm-actions">
          <button class="btn btn-gold" id="roleStart">أساسي 🟢</button>
          <button class="btn btn-ghost" id="roleBench">الدكة 🪑</button>
        </div>
      </div>
    </div>` : ''}
  `;

  if(!settling){
    document.getElementById('bid1').onclick = ()=>placeBid(1);
    document.getElementById('bid3').onclick = ()=>placeBid(3);
  }
  if(pending){
    document.getElementById('roleStart').onclick = ()=>assignRole(pending.id, 'start');
    document.getElementById('roleBench').onclick = ()=>assignRole(pending.id, 'bench');
  }
  attachTilt();
}

function renderPitchHTML(squad){
  const rows = PITCH_ROWS.map(pos=>{
    const starters = squad.filter(x=>x.pos===pos && x.role==='start');
    const slots = [];
    for(let i=0;i<STARTER_MAX[pos];i++){
      const p = starters[i];
      slots.push(p
        ? `<div class="slot"><div class="slot-photo"><img ${imgAttrs(p.img)} alt=""></div><div class="slot-name">${esc(p.name)}</div></div>`
        : `<div class="slot"><div class="slot-empty">+</div><div class="slot-name">${POS_LABEL[pos]}</div></div>`);
    }
    return `<div class="pitch-row">${slots.join('')}</div>`;
  }).join('');
  const bench = squad.filter(x=>x.role==='bench');
  const benchHTML = bench.length
    ? bench.map(p=>`<div class="bench-chip"><div class="bc-photo"><img ${imgAttrs(p.img)} alt=""></div><div class="bc-name">${esc(p.name)}</div></div>`).join('')
    : `<div class="bench-empty">الدكة لسه فاضية</div>`;
  return `
    <div class="pitch">${rows}</div>
    <div class="bench-wrap">
      <div class="bench-title">الدكة (${bench.length})</div>
      <div class="bench-row">${benchHTML}</div>
    </div>
  `;
}

function attachTilt(){
  const el = document.querySelector('.jumbo');
  if(!el || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const move = (e)=>{
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left)/r.width - 0.5;
    const py = (e.clientY - r.top)/r.height - 0.5;
    el.style.transform = `perspective(900px) rotateY(${px*6}deg) rotateX(${-py*6}deg)`;
  };
  const reset = ()=>{ el.style.transform = 'perspective(900px) rotateY(0deg) rotateX(0deg)'; };
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseleave', reset);
}

function renderResults(){
  const s = localState;
  if(!s.results){
    app.innerHTML = `<div class="card"><div class="center-msg"><div class="spinner"></div>بنحلل التشكيلات ونحدد الترتيب النهائي...</div></div>`;
    return;
  }
  const ranking = [...s.results.ranking].sort((a,b)=>a.place-b.place);
  const medals = ['🥇','🥈','🥉','🏅'];
  const winner = ranking[0];

  app.innerHTML = `
    <div class="winner-banner">
      <div class="shine"></div>
      <div class="crown">👑</div>
      <h3>${esc(winner.managerName)} بطل المزاد!</h3>
      <p>${esc(s.results.overall||'')}</p>
    </div>
    ${ranking.map((r, i)=>{
      const p = s.players[r.managerName];
      return `
      <div class="rank-card">
        <div class="rank-head">
          <div class="rank-medal">${medals[i]||'🏅'}</div>
          <div class="rn">${esc(r.managerName)}${r.managerName===myName?' (إنت)':''}</div>
          <div class="rs">${r.score}/100</div>
        </div>
        <div class="rank-verdict">${esc(r.verdict||'')}</div>
        ${p ? renderPitchHTML(p.squad) : ''}
      </div>`;
    }).join('')}
    <button class="btn btn-ghost" id="newGameBtn" style="margin-top:8px;">لعبة جديدة</button>
  `;
  document.getElementById('newGameBtn').onclick = ()=>{ location.href = location.pathname; };
}

render();
</script>
</body>
</html>
